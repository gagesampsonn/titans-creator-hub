<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Titans - Campaign Management</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#111113', raised: '#18181B', overlay: '#1E1E22' },
            border: { DEFAULT: '#27272A', light: '#3F3F46' },
            label: { DEFAULT: '#A1A1AA', dim: '#71717A', faint: '#52525B' },
            primary: '#FAFAFA',
            accent: '#E4E4E7',
            action: '#FAFAFA',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #111113; color: #FAFAFA; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #111113; }
    ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 2px; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const ADMIN_PINS = ["424342", "742896"];
    const SUPABASE_URL = "https://luegkjhpmmdflyksmmnb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_k0UnSsbi8ftmyvzK6Fxznw_CcpaOqMm";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TIER_PRESETS = [
      { value: 5, label: "5 Creators", videos: 120 },
      { value: 10, label: "10 Creators", videos: 225 },
      { value: 15, label: "15 Creators", videos: 325 },
    ];

    // ─── Supabase helpers ──────────────────────────────────────
    function toDbCampaign(c) {
      // Only send columns that exist on your `campaigns` table (no budget / management_fee fields).
      return {
        id: c.id, brand_name: c.brandName, product_name: c.productName || null,
        slug: c.slug, tier: c.tier, rate_per_video: c.ratePerVideo,
        total_videos: c.totalVideos, total_videos_admin: c.totalVideosAdmin || null,
        start_date: c.startDate, end_date: c.endDate,
        brief_link: c.briefLink || null, showcase_link: c.showcaseLink || null,
        onboarding_days: c.onboardingDays, phase1: c.phase1, phase2: c.phase2,
        creators: c.creators || [], phase2_creators: c.phase2Creators || [],
        updated_at: new Date().toISOString(),
      };
    }
    function fromDbCampaign(r) {
      return {
        id: r.id, brandName: r.brand_name, productName: r.product_name || "",
        slug: r.slug, tier: r.tier, ratePerVideo: r.rate_per_video,
        totalVideos: r.total_videos, totalVideosAdmin: r.total_videos_admin,
        startDate: r.start_date, endDate: r.end_date,
        briefLink: r.brief_link || "", showcaseLink: r.showcase_link || "",
        onboardingDays: r.onboarding_days, phase1: r.phase1, phase2: r.phase2,
        creators: r.creators || [], phase2Creators: r.phase2_creators || [],
      };
    }

    async function dbLoadCampaigns() {
      const { data, error } = await sb.from("campaigns").select("*").order("created_at", { ascending: false });
      if (error) { console.error("Load campaigns error:", error); return []; }
      return data.map(fromDbCampaign);
    }
    async function dbSaveCampaign(campaign) {
      const row = toDbCampaign(campaign);
      const { error } = await sb.from("campaigns").upsert(row, { onConflict: "id" });
      if (error) console.error("Save campaign error:", error);
      return { error };
    }
    async function dbDeleteCampaign(id) {
      const { error } = await sb.from("campaigns").delete().eq("id", id);
      if (error) console.error("Delete campaign error:", error);
    }

    function generateId() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }
    function addDaysToDate(dateStr, days) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T00:00:00");
      d.setDate(d.getDate() + days);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function addDaysISO(dateStr, days) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T00:00:00");
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function slugify(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g, "").replace(/^-+|-+$/g, ""); }

    // ─── Shared UI Primitives ──────────────────────────────────
    function SectionLabel({ children }) {
      return <div className="text-[11px] font-semibold text-label-dim uppercase tracking-[0.08em] mb-3">{children}</div>;
    }

    function InputField({ label, required, children }) {
      return (
        <div>
          <label className="block text-[13px] font-medium text-label mb-1.5">{label}{required && <span className="text-label-faint ml-0.5">*</span>}</label>
          {children}
        </div>
      );
    }

    const inputClass = "w-full bg-surface-overlay border border-border rounded-lg px-3.5 py-2.5 text-[14px] text-primary placeholder-label-faint focus:outline-none focus:border-label-dim transition-colors";
    const btnPrimary = "bg-primary text-surface font-semibold rounded-lg transition-all hover:bg-accent active:scale-[0.98]";
    const btnSecondary = "bg-surface-overlay border border-border text-label font-medium rounded-lg hover:border-border-light hover:text-primary transition-all";

    // ─── PIN Gate ──────────────────────────────────────────────
    function PinGate({ onUnlock }) {
      const [pin, setPin] = useState("");
      const [error, setError] = useState(false);
      const ref = useRef(null);
      useEffect(() => { if (ref.current) ref.current.focus(); }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (ADMIN_PINS.includes(pin)) { sessionStorage.setItem("admin_unlocked", "1"); onUnlock(); }
        else { setError(true); setPin(""); setTimeout(() => setError(false), 2000); }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-surface-raised border border-border rounded-xl p-8 w-full max-w-sm">
            <div className="mb-8">
              <h1 className="text-[20px] font-bold text-primary mb-1">Admin Access</h1>
              <p className="text-[13px] text-label-dim">Enter your PIN to continue.</p>
            </div>
            <form onSubmit={handleSubmit}>
              <input ref={ref} type="password" inputMode="numeric" maxLength={6} value={pin}
                onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))} placeholder="------"
                className={`${inputClass} text-center text-xl tracking-[0.4em] ${error ? "border-red-500/60" : ""}`} />
              {error && <p className="text-red-400 text-[12px] mt-2">Incorrect PIN. Try again.</p>}
              <button type="submit" className={`w-full mt-4 ${btnPrimary} py-3 text-[14px]`}>Unlock</button>
            </form>
          </div>
        </div>
      );
    }

    /** Last calendar day of the campaign (start + onboarding + phase1 + phase2 − 1). */
    function computeCampaignEndDate(form) {
      if (!form.startDate) return form.endDate || "";
      const ob = form.onboardingDays || 0;
      const p1 = form.phase1?.days || 0;
      const p2 = form.phase2?.days || 0;
      const total = ob + p1 + p2;
      if (total < 1) return form.endDate || "";
      return addDaysISO(form.startDate, total - 1);
    }

    // ─── Campaign Link Preview ─────────────────────────────────
    function CampaignPreview({ campaign }) {
      const totalDays = (campaign.onboardingDays || 14) + (campaign.phase1?.days || 15) + (campaign.phase2?.days || 15);

      return (
        <div className="bg-surface-raised border border-border rounded-xl p-6">
          <SectionLabel>Campaign Link Preview</SectionLabel>
          <div className="bg-surface border border-border rounded-lg px-4 py-2 mb-4 flex items-center justify-between">
            <span className="text-[13px] text-label font-mono">titansagency.co/<span className="text-primary font-semibold">{campaign.slug || "---"}</span></span>
            {campaign.slug && (
              <button onClick={() => navigator.clipboard.writeText("https://titansagency.co/" + campaign.slug)}
                className="text-[11px] text-label-dim hover:text-primary transition-colors font-medium">Copy</button>
            )}
          </div>

          {/* Preview of what creators see */}
          <div className="border border-border rounded-lg overflow-hidden">
            {/* Mock tracker header */}
            <div className="bg-surface-overlay px-5 py-4 border-b border-border">
              <div className="flex items-center justify-between mb-3">
                <span className="text-[11px] text-label-dim">Logged in as <span className="text-label">@creator</span></span>
                <span className="text-[11px] text-label-faint">Log out</span>
              </div>
              <div className="text-[16px] font-bold text-primary mb-0.5">
                {campaign.brandName || "Brand Name"}{campaign.productName ? ` \u2014 ${campaign.productName}` : ""}
              </div>
              <div className="text-[12px] text-label-dim mt-1">
                ${campaign.ratePerVideo || 25}/video &middot; {campaign.totalVideos || 0} videos &middot; {totalDays} days
              </div>
            </div>

            {/* Mock progress bar */}
            <div className="bg-surface-overlay px-5 py-3 border-b border-border">
              <div className="flex justify-between text-[12px] mb-1.5">
                <span className="text-label"><span className="text-primary font-semibold">0</span> / {campaign.totalVideos || 0} posted</span>
                <span className="text-label-dim font-medium">0%</span>
              </div>
              <div className="w-full bg-surface rounded h-1.5">
                <div className="bg-label-dim h-full rounded" style={{ width: "0%" }} />
              </div>
            </div>

            {/* Mock calendar preview - 7 small boxes */}
            <div className="bg-surface-overlay px-5 py-4 border-b border-border">
              <div className="text-[12px] font-semibold text-label mb-3">Calendar</div>
              <div className="flex gap-1.5">
                {[1,2,3,4,5,6,7].map((d) => (
                  <div key={d} className="w-8 h-8 rounded border border-border bg-surface flex items-center justify-center text-[10px] text-label-faint font-medium">{d}</div>
                ))}
                <div className="flex items-center text-[10px] text-label-faint ml-1">...</div>
              </div>
            </div>

            {/* Phase timeline */}
            <div className="bg-surface-overlay px-5 py-3">
              <div className="flex rounded overflow-hidden h-1.5 mb-2">
                <div className="h-full bg-label-faint" style={{ width: `${((campaign.onboardingDays || 14) / totalDays) * 100}%` }} />
                <div className="h-full bg-label-dim" style={{ width: `${((campaign.phase1?.days || 15) / totalDays) * 100}%` }} />
                <div className="h-full bg-label" style={{ width: `${((campaign.phase2?.days || 15) / totalDays) * 100}%` }} />
              </div>
              <div className="flex text-[10px] text-label-faint gap-4">
                <span>Onboarding {campaign.onboardingDays || 14}d</span>
                <span>Phase 1 {campaign.phase1?.days || 15}d</span>
                <span>Phase 2 {campaign.phase2?.days || 15}d</span>
              </div>
            </div>
          </div>

          {/* Status checks */}
          <div className="mt-4 space-y-2">
            <StatusCheck ok={!!campaign.brandName} label="Brand name set" />
            <StatusCheck ok={!!campaign.slug} label="Campaign URL configured" />
            <StatusCheck ok={!!campaign.startDate && !!computeCampaignEndDate(campaign)} label="Dates configured" />
            <StatusCheck ok={(campaign.creators?.length || 0) > 0} label="Creators assigned" />
          </div>
        </div>
      );
    }

    function StatusCheck({ ok, label }) {
      return (
        <div className="flex items-center gap-2 text-[12px]">
          <div className={`w-1.5 h-1.5 rounded-full ${ok ? "bg-emerald-400" : "bg-label-faint"}`} />
          <span className={ok ? "text-label" : "text-label-faint"}>{label}</span>
        </div>
      );
    }

    // ─── Campaign Form ─────────────────────────────────────────
    function CampaignForm({ campaign, onSave, onCancel, saveError, onClearSaveError, saving }) {
      const [form, setForm] = useState(campaign || {
        id: generateId(), brandName: "", productName: "", slug: "", tier: 10,
        ratePerVideo: 25, totalVideos: 225, totalVideosAdmin: 225, startDate: "", endDate: "",
        briefLink: "", showcaseLink: "",
        phase1: { name: "Phase 1 \u2014 Launch", days: 15, description: "All creators post daily" },
        phase2: { name: "Phase 2 \u2014 Scale", days: 15, description: "Top performers continue" },
        onboardingDays: 14, creators: [],
      });
      const [creatorInput, setCreatorInput] = useState("");
      const [slugManual, setSlugManual] = useState(!!campaign?.slug);
      const isCustomTier = !TIER_PRESETS.some(t => t.value === form.tier);

      const set = (key, val) => {
        onClearSaveError && onClearSaveError();
        setForm((prev) => ({ ...prev, [key]: val }));
      };
      const handleBrandChange = (val) => { set("brandName", val); if (!slugManual) set("slug", slugify(val)); };
      const handleSlugChange = (val) => { setSlugManual(true); set("slug", val.toLowerCase().replace(/[^a-z0-9]/g, "")); };
      const handleTierChange = (v) => { const preset = TIER_PRESETS.find(t => t.value === v); set("tier", v); if (preset) { set("totalVideos", preset.videos); set("totalVideosAdmin", preset.videos); } };

      const addCreator = () => {
        const h = creatorInput.trim(); if (!h) return;
        const n = h.startsWith("@") ? h : "@" + h;
        if (!form.creators.includes(n)) set("creators", [...form.creators, n]);
        setCreatorInput("");
      };
      const removeCreator = (h) => set("creators", form.creators.filter(c => c !== h));

      const [validationError, setValidationError] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        onClearSaveError && onClearSaveError();
        if (!form.brandName || !form.slug || !form.startDate) {
          setValidationError("Fill in Brand name, Campaign URL, and Start date.");
          return;
        }
        setValidationError("");
        const endDate = computeCampaignEndDate(form);
        onSave({ ...form, endDate });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
          {/* Form column */}
          <form onSubmit={handleSubmit} className="lg:col-span-3 space-y-5">
            {(validationError || saveError) && (
              <div className="rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-3 text-[13px] text-red-300">
                {validationError || saveError}
              </div>
            )}
            <p className="text-[12px] text-label-dim -mt-2 mb-1">
              End date is set automatically from your phase lengths (last day of Phase 2). Change Start date or phase days to adjust.
            </p>
            {/* Details */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Campaign Details</SectionLabel>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <InputField label="Brand Name" required>
                  <input value={form.brandName} onChange={(e) => handleBrandChange(e.target.value)} required className={inputClass} placeholder="Natural Stacks" />
                </InputField>
                <InputField label="Product Name">
                  <input value={form.productName} onChange={(e) => set("productName", e.target.value)} className={inputClass} placeholder="Dopamine Brain Food" />
                </InputField>
              </div>
              <InputField label="Campaign URL" required>
                <div className={`flex items-center bg-surface-overlay border border-border rounded-lg overflow-hidden focus-within:border-label-dim transition-colors`}>
                  <span className="text-label-dim text-[13px] pl-3.5 font-mono whitespace-nowrap">titansagency.co/</span>
                  <input value={form.slug} onChange={(e) => handleSlugChange(e.target.value)} required
                    className="flex-1 bg-transparent px-1 py-2.5 text-[14px] text-primary font-mono focus:outline-none" placeholder="naturalstacks" />
                </div>
              </InputField>
            </div>

            {/* Size */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Campaign Size</SectionLabel>
              <div className="grid grid-cols-4 gap-2">
                {TIER_PRESETS.map((tier) => (
                  <button key={tier.value} type="button" onClick={() => handleTierChange(tier.value)}
                    className={`rounded-lg p-3 text-center transition-all border ${form.tier === tier.value && !isCustomTier ? "border-primary/30 bg-surface-overlay" : "border-border bg-surface hover:border-border-light"}`}>
                    <div className="text-[18px] font-bold text-primary">{tier.value}</div>
                    <div className="text-[11px] text-label-dim mt-0.5">{tier.videos} videos</div>
                  </button>
                ))}
                <button type="button" onClick={() => { if (!isCustomTier) { set("tier", 1); set("totalVideos", 0); set("totalVideosAdmin", 0); } }}
                  className={`rounded-lg p-3 text-center transition-all border ${isCustomTier ? "border-primary/30 bg-surface-overlay" : "border-border bg-surface hover:border-border-light"}`}>
                  <div className="text-[14px] font-bold text-primary">Custom</div>
                  <div className="text-[11px] text-label-dim mt-0.5">Set below</div>
                </button>
              </div>
              {isCustomTier && (
                <div className="grid grid-cols-2 gap-3 mt-4">
                  <InputField label="Number of Creators">
                    <input type="number" min="1" value={form.tier} onChange={(e) => set("tier", parseInt(e.target.value) || 1)} className={inputClass} />
                  </InputField>
                  <InputField label="Total Videos (Campaign)">
                    <input type="number" min="1" value={form.totalVideosAdmin} onChange={(e) => { const v = parseInt(e.target.value) || 0; set("totalVideosAdmin", v); set("totalVideos", v); }} className={inputClass} />
                  </InputField>
                </div>
              )}
            </div>

            {/* Dates + Phases */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Schedule</SectionLabel>
              <div className="grid grid-cols-2 gap-4 mb-5">
                <InputField label="Start Date" required>
                  <input type="date" value={form.startDate} onChange={(e) => set("startDate", e.target.value)} required className={inputClass} />
                </InputField>
                <InputField label="End Date (auto)">
                  <input type="date" value={computeCampaignEndDate(form)} readOnly disabled
                    className={`${inputClass} opacity-80 cursor-not-allowed`} title="Computed from start date + onboarding + phase 1 + phase 2" />
                </InputField>
              </div>

              <SectionLabel>Phase Structure</SectionLabel>
              {(() => {
                const ob = form.onboardingDays || 14;
                const p1 = form.phase1?.days || 15;
                const p2 = form.phase2?.days || 15;
                const obStart = form.startDate;
                const obEnd = obStart ? addDaysISO(obStart, ob - 1) : "";
                const p1Start = obStart ? addDaysISO(obStart, ob) : "";
                const p1End = obStart ? addDaysISO(obStart, ob + p1 - 1) : "";
                const p2Start = obStart ? addDaysISO(obStart, ob + p1) : "";
                const p2End = obStart ? addDaysISO(obStart, ob + p1 + p2 - 1) : "";

                const phases = [
                  { key: "onboarding", label: "Onboarding", value: ob, onChange: (v) => set("onboardingDays", v), desc: "Source creators, ship samples, set up Spark Ads", dateRange: obStart ? `${addDaysToDate(obStart, 0)} \u2013 ${addDaysToDate(obStart, ob - 1)}` : "" },
                  { key: "phase1", label: "Phase 1 \u2014 Launch", value: p1, onChange: (v) => set("phase1", { ...form.phase1, days: v }), desc: "All creators post daily", dateRange: p1Start ? `${addDaysToDate(p1Start, 0)} \u2013 ${addDaysToDate(obStart, ob + p1 - 1)}` : "" },
                  { key: "phase2", label: "Phase 2 \u2014 Scale", value: p2, onChange: (v) => set("phase2", { ...form.phase2, days: v }), desc: "Top performers continue", dateRange: p2Start ? `${addDaysToDate(p2Start, 0)} \u2013 ${addDaysToDate(obStart, ob + p1 + p2 - 1)}` : "" },
                ];

                return (
                  <div className="space-y-2">
                    {phases.map((p) => (
                      <div key={p.key} className="bg-surface-overlay border border-border rounded-lg px-4 py-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <div className="text-[13px] font-medium text-primary">{p.label}</div>
                            <div className="text-[11px] text-label-faint">{p.desc}</div>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <input type="number" min="1" max="60" value={p.value}
                              onChange={(e) => p.onChange(parseInt(e.target.value) || 1)}
                              className="w-14 bg-surface border border-border rounded px-2 py-1 text-[13px] text-primary text-center focus:outline-none focus:border-label-dim" />
                            <span className="text-[11px] text-label-faint">days</span>
                          </div>
                        </div>
                        {p.dateRange && (
                          <div className="mt-2 text-[11px] text-label-dim font-mono">{p.dateRange}</div>
                        )}
                      </div>
                    ))}
                  </div>
                );
              })()}
            </div>

            {/* Pay */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Compensation</SectionLabel>
              <div className="grid grid-cols-2 gap-4">
                <InputField label="Rate Per Video ($)">
                  <input type="number" min="1" value={form.ratePerVideo} onChange={(e) => set("ratePerVideo", parseInt(e.target.value) || 25)} className={inputClass} />
                </InputField>
                <InputField label="Videos Per Creator">
                  <input type="number" min="1" value={form.totalVideos} onChange={(e) => set("totalVideos", parseInt(e.target.value) || 0)} className={inputClass} />
                </InputField>
              </div>
              <div className="mt-4">
                <InputField label="Total Videos (Campaign-wide)">
                  <input type="number" min="0" value={form.totalVideosAdmin || ""} onChange={(e) => set("totalVideosAdmin", parseInt(e.target.value) || 0)} className={inputClass} placeholder="Auto-calculated or set manually" />
                </InputField>
                <p className="text-[11px] text-label-faint mt-1">Admin-only. Not shown to creators.</p>
              </div>
            </div>

            {/* Links */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Links</SectionLabel>
              <div className="space-y-3">
                <InputField label="Brief / Discord Link">
                  <input value={form.briefLink} onChange={(e) => set("briefLink", e.target.value)} className={inputClass} placeholder="https://discord.com/channels/..." />
                </InputField>
                <InputField label="Showcase / Product Link">
                  <input value={form.showcaseLink} onChange={(e) => set("showcaseLink", e.target.value)} className={inputClass} placeholder="https://affiliate-us.tiktok.com/..." />
                </InputField>
              </div>
            </div>

            {/* Phase 1 Creators */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Phase 1 Creators</SectionLabel>
              <p className="text-[12px] text-label-faint mb-3">All creators assigned to the campaign. They will see this campaign when they log in.</p>

              <div className="flex gap-2 mb-4">
                <input value={creatorInput} onChange={(e) => setCreatorInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addCreator(); } }}
                  className={`${inputClass} flex-1`} placeholder="@discordhandle" />
                <button type="button" onClick={addCreator} className={`${btnPrimary} px-4 py-2.5 text-[13px]`}>Add</button>
              </div>

              {form.creators.length === 0 ? (
                <p className="text-label-faint text-[13px] text-center py-3">No creators assigned yet</p>
              ) : (
                <div className="flex flex-wrap gap-1.5">
                  {form.creators.map((h) => (
                    <span key={h} className="inline-flex items-center gap-1.5 bg-surface-overlay border border-border rounded px-3 py-1.5 text-[13px]">
                      <span className="text-primary">{h}</span>
                      <button type="button" onClick={() => removeCreator(h)} className="text-label-faint hover:text-red-400 transition-colors">&times;</button>
                    </span>
                  ))}
                </div>
              )}
              <div className="mt-2 text-[11px] text-label-faint">{form.creators.length} / {form.tier} slots filled</div>
            </div>

            {/* Phase 2 Creators */}
            <div className="bg-surface-raised border border-border rounded-xl p-6">
              <SectionLabel>Phase 2 Creators</SectionLabel>
              <p className="text-[12px] text-label-faint mb-3">Top performers who continue into Phase 2. Select from your Phase 1 creators. You can set this later.</p>

              {form.creators.length === 0 ? (
                <p className="text-label-faint text-[13px] text-center py-3">Add Phase 1 creators first</p>
              ) : (
                <div className="space-y-1.5">
                  {form.creators.map((h) => {
                    const selected = (form.phase2Creators || []).includes(h);
                    return (
                      <button key={h} type="button" onClick={() => {
                        const current = form.phase2Creators || [];
                        set("phase2Creators", selected ? current.filter(c => c !== h) : [...current, h]);
                      }}
                        className={`w-full flex items-center justify-between px-4 py-2.5 rounded-lg border transition-all text-left ${selected ? "border-primary/30 bg-surface-overlay" : "border-border bg-surface hover:border-border-light"}`}>
                        <span className="text-[13px] text-primary">{h}</span>
                        <span className={`text-[11px] font-medium ${selected ? "text-emerald-400" : "text-label-faint"}`}>
                          {selected ? "Selected" : "Not selected"}
                        </span>
                      </button>
                    );
                  })}
                </div>
              )}
              <div className="mt-2 text-[11px] text-label-faint">{(form.phase2Creators || []).length} / {form.creators.length} selected for Phase 2</div>
            </div>

            {/* Actions */}
            <div className="flex gap-3">
              <button type="submit" disabled={saving} className={`flex-1 ${btnPrimary} py-3 text-[14px] disabled:opacity-50 disabled:cursor-not-allowed`}>
                {saving ? "Saving…" : campaign ? "Save Changes" : "Create Campaign"}
              </button>
              {onCancel && (
                <button type="button" onClick={onCancel} className={`${btnSecondary} px-5 py-3 text-[14px]`}>Cancel</button>
              )}
            </div>
          </form>

          {/* Preview sidebar */}
          <div className="lg:col-span-2 lg:sticky lg:top-6 lg:self-start">
            <CampaignPreview campaign={form} />
          </div>
        </div>
      );
    }

    // ─── Campaign Card ─────────────────────────────────────────
    function CampaignCard({ campaign, onEdit, onDelete }) {
      const tierLabel = TIER_PRESETS.find((t) => t.value === campaign.tier)?.label || `${campaign.tier} Creator${campaign.tier !== 1 ? "s" : ""}`;
      const totalDays = (campaign.onboardingDays || 14) + (campaign.phase1?.days || 15) + (campaign.phase2?.days || 15);
      const [copied, setCopied] = useState(false);

      const copyUrl = () => {
        navigator.clipboard.writeText("https://titansagency.co/" + campaign.slug);
        setCopied(true); setTimeout(() => setCopied(false), 1500);
      };

      return (
        <div className="bg-surface-raised border border-border rounded-xl p-5 hover:border-border-light transition-all">
          <div className="flex items-start justify-between mb-3">
            <div>
              <h3 className="text-[16px] font-bold text-primary">{campaign.brandName}</h3>
              {campaign.productName && <p className="text-[13px] text-label-dim">{campaign.productName}</p>}
            </div>
            <span className="text-[11px] font-semibold text-label-dim border border-border rounded px-2 py-0.5">{tierLabel}</span>
          </div>

          {campaign.slug && (
            <div className="mb-4 bg-surface border border-border rounded-lg px-3 py-2 flex items-center justify-between">
              <span className="text-[12px] text-label-dim font-mono">titansagency.co/<span className="text-primary font-medium">{campaign.slug}</span></span>
              <button onClick={copyUrl} className="text-[11px] text-label-dim hover:text-primary transition-colors font-medium">
                {copied ? "Copied" : "Copy"}
              </button>
            </div>
          )}

          <div className="grid grid-cols-5 gap-2 mb-4">
            {[
              { l: "Start", v: campaign.startDate || "\u2014" },
              { l: "End", v: campaign.endDate || "\u2014" },
              { l: "Videos", v: campaign.totalVideosAdmin || campaign.totalVideos },
              { l: "Per Creator", v: campaign.totalVideos },
              { l: "Rate", v: "$" + campaign.ratePerVideo },
            ].map((s) => (
              <div key={s.l} className="bg-surface border border-border rounded-lg px-3 py-2">
                <div className="text-[10px] text-label-faint uppercase tracking-wide">{s.l}</div>
                <div className="text-[13px] font-semibold text-primary mt-0.5">{s.v}</div>
              </div>
            ))}
          </div>

          {/* Phase bar */}
          <div className="flex rounded overflow-hidden h-1 mb-2">
            <div className="h-full bg-label-faint" style={{ width: `${((campaign.onboardingDays || 14) / totalDays) * 100}%` }} />
            <div className="h-full bg-label-dim" style={{ width: `${((campaign.phase1?.days || 15) / totalDays) * 100}%` }} />
            <div className="h-full bg-label" style={{ width: `${((campaign.phase2?.days || 15) / totalDays) * 100}%` }} />
          </div>
          <div className="flex gap-3 text-[10px] text-label-faint mb-4">
            <span>Onboard {campaign.onboardingDays || 14}d</span>
            <span>Phase 1 {campaign.phase1?.days || 15}d</span>
            <span>Phase 2 {campaign.phase2?.days || 15}d</span>
          </div>

          {/* Creators */}
          <div className="mb-4">
            <div className="text-[11px] text-label-faint mb-1.5">Creators ({campaign.creators?.length || 0} / {campaign.tier})</div>
            {campaign.creators?.length > 0 ? (
              <div className="flex flex-wrap gap-1">
                {campaign.creators.map((c) => (
                  <span key={c} className="bg-surface border border-border text-[11px] px-2 py-0.5 rounded text-label font-medium">{c}</span>
                ))}
              </div>
            ) : (
              <span className="text-[11px] text-label-faint">No creators assigned</span>
            )}
          </div>

          <div className="flex gap-2">
            <button onClick={() => onEdit(campaign)} className={`flex-1 ${btnSecondary} py-2 text-[13px]`}>Edit</button>
            <button onClick={() => onDelete(campaign.id)} className="bg-surface-overlay border border-border text-red-400/70 font-medium rounded-lg hover:border-red-500/30 hover:text-red-400 transition-all px-3.5 py-2 text-[13px]">Delete</button>
          </div>
        </div>
      );
    }

    // ─── Admin Dashboard ───────────────────────────────────────
    function AdminDashboard() {
      const [campaigns, setCampaigns] = useState([]);
      const [view, setView] = useState("list");
      const [editingCampaign, setEditingCampaign] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saveError, setSaveError] = useState("");
      const [saving, setSaving] = useState(false);

      useEffect(() => { dbLoadCampaigns().then((c) => { setCampaigns(c); setLoading(false); }); }, []);

      const handleSave = async (campaign) => {
        setSaveError("");
        setSaving(true);
        const { error } = await dbSaveCampaign(campaign);
        setSaving(false);
        if (error) {
          const msg = error.message || String(error);
          const hint = /permission|policy|RLS|row-level/i.test(msg)
            ? " Check Supabase → campaigns → RLS policies allow INSERT/UPDATE for anon (or use the service role from a server)."
            : "";
          setSaveError("Save failed: " + msg + hint);
          return;
        }
        const updated = await dbLoadCampaigns();
        setCampaigns(updated);
        setView("list"); setEditingCampaign(null);
      };
      const handleEdit = (c) => { setEditingCampaign(c); setView("edit"); };
      const handleDelete = async (id) => {
        if (!confirm("Delete this campaign? This cannot be undone.")) return;
        await dbDeleteCampaign(id);
        setCampaigns((prev) => prev.filter((c) => c.id !== id));
      };
      const handleLogout = () => { sessionStorage.removeItem("admin_unlocked"); window.location.reload(); };

      return (
        <div className="max-w-5xl mx-auto px-5 py-8">
          {/* Header */}
          <div className="flex items-center justify-between mb-8 pb-6 border-b border-border">
            <div>
              <h1 className="text-[22px] font-bold text-primary tracking-tight">Titans</h1>
              <p className="text-[13px] text-label-dim mt-0.5">Campaign Management</p>
            </div>
            <button onClick={handleLogout} className="text-[13px] text-label-faint hover:text-primary transition-colors">Sign out</button>
          </div>

          {loading && <div className="text-center py-20 text-label-dim text-[14px]">Loading campaigns...</div>}

          {!loading && view === "list" && (
            <>
              <button onClick={() => { setEditingCampaign(null); setView("create"); }}
                className={`w-full ${btnPrimary} py-3.5 mb-6 text-[14px]`}>
                New Campaign
              </button>

              {campaigns.length === 0 ? (
                <div className="text-center py-20 border border-border border-dashed rounded-xl">
                  <h2 className="text-[16px] font-semibold text-primary mb-1">No campaigns yet</h2>
                  <p className="text-[13px] text-label-dim">Create your first campaign to get started.</p>
                </div>
              ) : (
                <div className="space-y-3">
                  {campaigns.map((c) => (
                    <CampaignCard key={c.id} campaign={c} onEdit={handleEdit} onDelete={handleDelete} />
                  ))}
                </div>
              )}
            </>
          )}

          {view === "create" && (
            <>
              <div className="flex items-center justify-between mb-6">
                <h2 className="text-[18px] font-bold text-primary">New Campaign</h2>
                <button onClick={() => { setView("list"); setSaveError(""); }} className="text-[13px] text-label-dim hover:text-primary transition-colors">Cancel</button>
              </div>
              <CampaignForm onSave={handleSave} onCancel={() => { setView("list"); setSaveError(""); }} saveError={saveError} onClearSaveError={() => setSaveError("")} saving={saving} />
            </>
          )}

          {view === "edit" && editingCampaign && (
            <>
              <div className="flex items-center justify-between mb-6">
                <h2 className="text-[18px] font-bold text-primary">Edit Campaign</h2>
                <button onClick={() => { setView("list"); setEditingCampaign(null); setSaveError(""); }} className="text-[13px] text-label-dim hover:text-primary transition-colors">Cancel</button>
              </div>
              <CampaignForm campaign={editingCampaign} onSave={handleSave} onCancel={() => { setView("list"); setEditingCampaign(null); setSaveError(""); }} saveError={saveError} onClearSaveError={() => setSaveError("")} saving={saving} />
            </>
          )}
        </div>
      );
    }

    function App() {
      const [unlocked, setUnlocked] = useState(sessionStorage.getItem("admin_unlocked") === "1");
      if (!unlocked) return <PinGate onUnlock={() => setUnlocked(true)} />;
      return <AdminDashboard />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
