<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Titans Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#0f0f0f',
            'dark-card': '#1a1a1a',
            'dark-input': '#222222',
            'accent': '#ff6b00',
            'accent-hover': '#e55f00',
            'success': '#22c55e',
            'muted': '#555555',
            'danger': '#ef4444',
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const ADMIN_PIN = "424342";
    const STORAGE_KEY = "retainers_campaigns";

    const TIER_OPTIONS = [
      { value: 5, label: "5 Creators", videos: 120, desc: "Starter campaign" },
      { value: 10, label: "10 Creators", videos: 225, desc: "Growth campaign" },
      { value: 15, label: "15 Creators", videos: 325, desc: "Scale campaign" },
    ];

    function loadCampaigns() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }

    function saveCampaigns(campaigns) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(campaigns));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    // ─── PIN Gate ──────────────────────────────────────────────
    function PinGate({ onUnlock }) {
      const [pin, setPin] = useState("");
      const [error, setError] = useState(false);
      const inputRef = useRef(null);

      useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (pin === ADMIN_PIN) {
          sessionStorage.setItem("admin_unlocked", "1");
          onUnlock();
        } else {
          setError(true);
          setPin("");
          setTimeout(() => setError(false), 2000);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-dark-card rounded-2xl p-8 w-full max-w-sm shadow-2xl">
            <div className="text-center mb-8">
              <div className="text-4xl mb-2">🔒</div>
              <h1 className="text-2xl font-bold mb-1">Admin Access</h1>
              <p className="text-muted text-sm">Enter your PIN to continue</p>
            </div>
            <form onSubmit={handleSubmit}>
              <input
                ref={inputRef}
                type="password"
                inputMode="numeric"
                maxLength={6}
                value={pin}
                onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))}
                placeholder="Enter PIN"
                className={`w-full bg-dark-input border rounded-xl px-4 py-4 text-center text-2xl tracking-[0.5em] text-white placeholder-muted focus:outline-none transition-colors ${error ? "border-danger shake" : "border-muted focus:border-accent"}`}
              />
              {error && <p className="text-danger text-sm text-center mt-2">Incorrect PIN</p>}
              <button type="submit" className="w-full mt-4 bg-accent hover:bg-accent-hover text-white font-bold text-lg rounded-xl py-4 transition-colors active:scale-95">
                Unlock
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ─── Campaign Form ─────────────────────────────────────────
    function CampaignForm({ campaign, onSave, onCancel }) {
      const [form, setForm] = useState(campaign || {
        id: generateId(),
        brandName: "",
        productName: "",
        tier: 10,
        ratePerVideo: 25,
        totalVideos: 225,
        startDate: "",
        endDate: "",
        briefLink: "",
        showcaseLink: "",
        phase1: { name: "Phase 1 — Launch", days: 15, description: "All creators post daily" },
        phase2: { name: "Phase 2 — Scale", days: 15, description: "Top performers continue" },
        onboardingDays: 14,
        creators: [],
      });
      const [creatorInput, setCreatorInput] = useState("");

      const set = (key, val) => setForm((prev) => ({ ...prev, [key]: val }));

      const handleTierChange = (tierVal) => {
        const tier = TIER_OPTIONS.find((t) => t.value === tierVal);
        set("tier", tierVal);
        set("totalVideos", tier.videos);
      };

      const addCreator = () => {
        const handle = creatorInput.trim();
        if (!handle) return;
        const normalized = handle.startsWith("@") ? handle : "@" + handle;
        if (!form.creators.includes(normalized)) {
          set("creators", [...form.creators, normalized]);
        }
        setCreatorInput("");
      };

      const removeCreator = (handle) => {
        set("creators", form.creators.filter((c) => c !== handle));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.brandName || !form.startDate || !form.endDate) return;
        onSave(form);
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-6">
          <div className="bg-dark-card rounded-2xl p-6">
            <h3 className="text-lg font-bold mb-4 text-accent">Campaign Details</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm text-muted mb-1">Brand Name *</label>
                <input value={form.brandName} onChange={(e) => set("brandName", e.target.value)} required
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" placeholder="e.g. Natural Stacks" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-1">Product Name</label>
                <input value={form.productName} onChange={(e) => set("productName", e.target.value)}
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" placeholder="e.g. Dopamine Brain Food" />
              </div>
            </div>
          </div>

          {/* Campaign Tier */}
          <div className="bg-dark-card rounded-2xl p-6">
            <h3 className="text-lg font-bold mb-4 text-accent">Campaign Size</h3>
            <div className="grid grid-cols-3 gap-3">
              {TIER_OPTIONS.map((tier) => (
                <button key={tier.value} type="button" onClick={() => handleTierChange(tier.value)}
                  className={`rounded-xl p-4 text-center transition-all border-2 ${form.tier === tier.value ? "border-accent bg-accent/10" : "border-muted/30 bg-dark-input hover:border-muted"}`}>
                  <div className="text-2xl font-bold">{tier.value}</div>
                  <div className="text-xs text-muted mt-1">Creators</div>
                  <div className="text-xs text-accent mt-1">{tier.videos} videos</div>
                </button>
              ))}
            </div>
          </div>

          {/* Dates */}
          <div className="bg-dark-card rounded-2xl p-6">
            <h3 className="text-lg font-bold mb-4 text-accent">Campaign Dates</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm text-muted mb-1">Start Date *</label>
                <input type="date" value={form.startDate} onChange={(e) => set("startDate", e.target.value)} required
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-1">End Date *</label>
                <input type="date" value={form.endDate} onChange={(e) => set("endDate", e.target.value)} required
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" />
              </div>
            </div>

            {/* Phase Structure */}
            <div className="mt-6">
              <h4 className="text-sm font-semibold text-muted mb-3 uppercase tracking-wider">Phase Structure</h4>
              <div className="space-y-3">
                <div className="bg-dark-input rounded-xl p-4 border border-muted/20">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-semibold text-purple-400">Onboarding</span>
                    <div className="flex items-center gap-2">
                      <input type="number" min="1" max="30" value={form.onboardingDays}
                        onChange={(e) => set("onboardingDays", parseInt(e.target.value) || 14)}
                        className="w-16 bg-dark-card border border-muted rounded-lg px-2 py-1 text-sm text-white text-center focus:outline-none focus:border-accent" />
                      <span className="text-xs text-muted">days</span>
                    </div>
                  </div>
                  <p className="text-xs text-muted">Source creators, ship samples, set up Spark Ads</p>
                </div>

                <div className="bg-dark-input rounded-xl p-4 border border-muted/20">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-semibold text-cyan-400">{form.phase1.name}</span>
                    <div className="flex items-center gap-2">
                      <input type="number" min="1" max="60" value={form.phase1.days}
                        onChange={(e) => set("phase1", { ...form.phase1, days: parseInt(e.target.value) || 15 })}
                        className="w-16 bg-dark-card border border-muted rounded-lg px-2 py-1 text-sm text-white text-center focus:outline-none focus:border-accent" />
                      <span className="text-xs text-muted">days</span>
                    </div>
                  </div>
                  <input value={form.phase1.description} onChange={(e) => set("phase1", { ...form.phase1, description: e.target.value })}
                    className="w-full bg-dark-card border border-muted/20 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent mt-1" placeholder="Phase description" />
                </div>

                <div className="bg-dark-input rounded-xl p-4 border border-muted/20">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-semibold text-green-400">{form.phase2.name}</span>
                    <div className="flex items-center gap-2">
                      <input type="number" min="1" max="60" value={form.phase2.days}
                        onChange={(e) => set("phase2", { ...form.phase2, days: parseInt(e.target.value) || 15 })}
                        className="w-16 bg-dark-card border border-muted rounded-lg px-2 py-1 text-sm text-white text-center focus:outline-none focus:border-accent" />
                      <span className="text-xs text-muted">days</span>
                    </div>
                  </div>
                  <input value={form.phase2.description} onChange={(e) => set("phase2", { ...form.phase2, description: e.target.value })}
                    className="w-full bg-dark-card border border-muted/20 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent mt-1" placeholder="Phase description" />
                </div>
              </div>
            </div>
          </div>

          {/* Rate */}
          <div className="bg-dark-card rounded-2xl p-6">
            <h3 className="text-lg font-bold mb-4 text-accent">Creator Pay</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm text-muted mb-1">Rate Per Video ($)</label>
                <input type="number" min="1" value={form.ratePerVideo} onChange={(e) => set("ratePerVideo", parseInt(e.target.value) || 25)}
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" />
              </div>
              <div>
                <label className="block text-sm text-muted mb-1">Total Videos</label>
                <input type="number" min="1" value={form.totalVideos} onChange={(e) => set("totalVideos", parseInt(e.target.value) || 0)}
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" />
              </div>
            </div>
          </div>

          {/* Links */}
          <div className="bg-dark-card rounded-2xl p-6">
            <h3 className="text-lg font-bold mb-4 text-accent">Links</h3>
            <div className="space-y-4">
              <div>
                <label className="block text-sm text-muted mb-1">Brief / Discord Link</label>
                <input value={form.briefLink} onChange={(e) => set("briefLink", e.target.value)}
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" placeholder="https://discord.com/channels/..." />
              </div>
              <div>
                <label className="block text-sm text-muted mb-1">Showcase / Product Link</label>
                <input value={form.showcaseLink} onChange={(e) => set("showcaseLink", e.target.value)}
                  className="w-full bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" placeholder="https://affiliate-us.tiktok.com/..." />
              </div>
            </div>
          </div>

          {/* Creators */}
          <div className="bg-dark-card rounded-2xl p-6">
            <h3 className="text-lg font-bold mb-4 text-accent">Assigned Creators</h3>
            <p className="text-xs text-muted mb-4">Add creators by their Discord handle. Only these creators will see this campaign when they log in to the tracker.</p>

            <div className="flex gap-2 mb-4">
              <input value={creatorInput} onChange={(e) => setCreatorInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addCreator(); } }}
                className="flex-1 bg-dark-input border border-muted rounded-xl px-4 py-3 text-white focus:outline-none focus:border-accent" placeholder="@discordhandle" />
              <button type="button" onClick={addCreator}
                className="px-5 py-3 bg-accent hover:bg-accent-hover text-white font-bold rounded-xl transition-colors whitespace-nowrap">
                Add
              </button>
            </div>

            {form.creators.length === 0 ? (
              <p className="text-muted text-sm text-center py-4">No creators assigned yet</p>
            ) : (
              <div className="flex flex-wrap gap-2">
                {form.creators.map((handle) => (
                  <span key={handle} className="inline-flex items-center gap-2 bg-dark-input border border-muted/30 rounded-full px-4 py-2 text-sm">
                    <span className="text-white">{handle}</span>
                    <button type="button" onClick={() => removeCreator(handle)} className="text-muted hover:text-danger transition-colors text-lg leading-none">&times;</button>
                  </span>
                ))}
              </div>
            )}
            <div className="mt-3 text-xs text-muted">{form.creators.length} / {form.tier} creators assigned</div>
          </div>

          {/* Actions */}
          <div className="flex gap-3">
            <button type="submit" className="flex-1 bg-accent hover:bg-accent-hover text-white font-bold text-lg rounded-xl py-4 transition-colors active:scale-95">
              {campaign ? "Update Campaign" : "Create Campaign"}
            </button>
            {onCancel && (
              <button type="button" onClick={onCancel} className="px-6 py-4 bg-dark-card border border-muted/30 text-muted hover:text-white rounded-xl transition-colors">
                Cancel
              </button>
            )}
          </div>
        </form>
      );
    }

    // ─── Campaign Card ─────────────────────────────────────────
    function CampaignCard({ campaign, onEdit, onDelete }) {
      const tierLabel = TIER_OPTIONS.find((t) => t.value === campaign.tier)?.label || `${campaign.tier} Creators`;
      const totalDays = (campaign.onboardingDays || 14) + (campaign.phase1?.days || 15) + (campaign.phase2?.days || 15);

      return (
        <div className="bg-dark-card rounded-2xl p-6 border border-muted/10 hover:border-muted/30 transition-all">
          <div className="flex items-start justify-between mb-4">
            <div>
              <h3 className="text-xl font-bold">{campaign.brandName}</h3>
              {campaign.productName && <p className="text-sm text-muted">{campaign.productName}</p>}
            </div>
            <span className="bg-accent/10 text-accent text-xs font-bold px-3 py-1 rounded-full">{tierLabel}</span>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
            <div className="bg-dark-input rounded-xl p-3">
              <div className="text-xs text-muted mb-1">Start</div>
              <div className="text-sm font-semibold">{campaign.startDate || "—"}</div>
            </div>
            <div className="bg-dark-input rounded-xl p-3">
              <div className="text-xs text-muted mb-1">End</div>
              <div className="text-sm font-semibold">{campaign.endDate || "—"}</div>
            </div>
            <div className="bg-dark-input rounded-xl p-3">
              <div className="text-xs text-muted mb-1">Videos</div>
              <div className="text-sm font-semibold">{campaign.totalVideos}</div>
            </div>
            <div className="bg-dark-input rounded-xl p-3">
              <div className="text-xs text-muted mb-1">Rate</div>
              <div className="text-sm font-semibold">${campaign.ratePerVideo}/vid</div>
            </div>
          </div>

          {/* Phase timeline mini */}
          <div className="flex rounded-lg overflow-hidden h-2 mb-3">
            <div className="h-full bg-purple-500" style={{ width: `${((campaign.onboardingDays || 14) / totalDays) * 100}%` }} />
            <div className="h-full bg-cyan-400" style={{ width: `${((campaign.phase1?.days || 15) / totalDays) * 100}%` }} />
            <div className="h-full bg-green-400" style={{ width: `${((campaign.phase2?.days || 15) / totalDays) * 100}%` }} />
          </div>
          <div className="flex gap-3 text-[10px] text-muted mb-4">
            <span>Onboard: {campaign.onboardingDays || 14}d</span>
            <span>Phase 1: {campaign.phase1?.days || 15}d</span>
            <span>Phase 2: {campaign.phase2?.days || 15}d</span>
          </div>

          {/* Creators */}
          <div className="mb-4">
            <div className="text-xs text-muted mb-2">Creators ({campaign.creators?.length || 0} / {campaign.tier})</div>
            {campaign.creators?.length > 0 ? (
              <div className="flex flex-wrap gap-1.5">
                {campaign.creators.map((c) => (
                  <span key={c} className="bg-dark-input text-xs px-2.5 py-1 rounded-full text-white/80">{c}</span>
                ))}
              </div>
            ) : (
              <span className="text-xs text-muted/50">None assigned</span>
            )}
          </div>

          <div className="flex gap-2">
            <button onClick={() => onEdit(campaign)} className="flex-1 bg-dark-input border border-muted/30 text-white font-semibold rounded-xl py-2.5 text-sm hover:border-accent transition-colors">
              Edit
            </button>
            <button onClick={() => onDelete(campaign.id)} className="px-4 py-2.5 bg-dark-input border border-muted/30 text-danger font-semibold rounded-xl text-sm hover:border-danger transition-colors">
              Delete
            </button>
          </div>
        </div>
      );
    }

    // ─── Admin Dashboard ───────────────────────────────────────
    function AdminDashboard() {
      const [campaigns, setCampaigns] = useState(loadCampaigns());
      const [view, setView] = useState("list"); // list | create | edit
      const [editingCampaign, setEditingCampaign] = useState(null);

      const handleSave = (campaign) => {
        setCampaigns((prev) => {
          const exists = prev.find((c) => c.id === campaign.id);
          const updated = exists ? prev.map((c) => (c.id === campaign.id ? campaign : c)) : [...prev, campaign];
          saveCampaigns(updated);
          return updated;
        });
        setView("list");
        setEditingCampaign(null);
      };

      const handleEdit = (campaign) => {
        setEditingCampaign(campaign);
        setView("edit");
      };

      const handleDelete = (id) => {
        if (!confirm("Delete this campaign? This cannot be undone.")) return;
        setCampaigns((prev) => {
          const updated = prev.filter((c) => c.id !== id);
          saveCampaigns(updated);
          return updated;
        });
      };

      const handleLogout = () => {
        sessionStorage.removeItem("admin_unlocked");
        window.location.reload();
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8">
          {/* Header */}
          <div className="flex items-center justify-between mb-8">
            <div>
              <h1 className="text-2xl font-bold flex items-center gap-2">
                <span className="text-accent">⚡</span> Titans Admin
              </h1>
              <p className="text-muted text-sm mt-1">Manage campaigns & creators</p>
            </div>
            <div className="flex items-center gap-3">
              <a href="/tracker/" className="text-sm text-muted hover:text-white transition-colors">Tracker →</a>
              <button onClick={handleLogout} className="text-sm text-muted hover:text-danger transition-colors">Logout</button>
            </div>
          </div>

          {view === "list" && (
            <>
              <button onClick={() => { setEditingCampaign(null); setView("create"); }}
                className="w-full bg-accent hover:bg-accent-hover text-white font-bold rounded-xl py-4 mb-6 transition-colors active:scale-[0.98] text-lg">
                + New Campaign
              </button>

              {campaigns.length === 0 ? (
                <div className="text-center py-20">
                  <div className="text-4xl mb-4">📋</div>
                  <h2 className="text-xl font-bold mb-2">No campaigns yet</h2>
                  <p className="text-muted text-sm">Create your first campaign to get started.</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {campaigns.map((c) => (
                    <CampaignCard key={c.id} campaign={c} onEdit={handleEdit} onDelete={handleDelete} />
                  ))}
                </div>
              )}
            </>
          )}

          {view === "create" && (
            <>
              <h2 className="text-xl font-bold mb-6">Create Campaign</h2>
              <CampaignForm onSave={handleSave} onCancel={() => setView("list")} />
            </>
          )}

          {view === "edit" && editingCampaign && (
            <>
              <h2 className="text-xl font-bold mb-6">Edit Campaign</h2>
              <CampaignForm campaign={editingCampaign} onSave={handleSave} onCancel={() => { setView("list"); setEditingCampaign(null); }} />
            </>
          )}
        </div>
      );
    }

    // ─── App ───────────────────────────────────────────────────
    function App() {
      const [unlocked, setUnlocked] = useState(sessionStorage.getItem("admin_unlocked") === "1");

      if (!unlocked) return <PinGate onUnlock={() => setUnlocked(true)} />;
      return <AdminDashboard />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
