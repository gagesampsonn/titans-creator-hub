        background: linear-gradient(135deg, #00F2EA 0%, #8B5CF6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .text-gradient-fuchsia {
        background: linear-gradient(135deg, #FF0050 0%, #8B5CF6 100%);
        -webkit-background-clip: text;

      }
      .glow-teal { box-shadow: 0 0 30px -10px rgba(0, 242, 234, 0.3); }
      .glow-purple { box-shadow: 0 0 30px -10px rgba(139, 92, 246, 0.3); }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
      @keyframes pulse-glow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      // ─── Campaign Config Data ────────────────────────────────────
      const CAMPAIGN_CONFIGS = {
        5:  { totalCost: 5500,  totalVideos: 120, managementFee: 2000, retainerBudget: 3500,  upfrontPayment: 3750, creatorsPhase1: 5, creatorsPhase2: 3 },
        10: { totalCost: 10500, totalVideos: 225, managementFee: 3000, retainerBudget: 7500,  upfrontPayment: 6750, creatorsPhase1: 10, creatorsPhase2: 5 },
        15: { totalCost: 13500, totalVideos: 325, managementFee: 3000, retainerBudget: 10500, upfrontPayment: 8250, creatorsPhase1: 15, creatorsPhase2: 8 },
      };

      const CAMPAIGN_DURATION = 44;

      const PHASES = [
        { name: 'Onboarding', days: 14, color: '#8B5CF6', tasks: ['Source & vet creators', 'Ship product samples', 'Set up Spark Ad codes', 'Brief creators on brand'] },
        { name: 'Phase 1 \u2014 Launch', days: 15, color: '#00F2EA', tasks: ['All creators post daily', 'Performance monitoring', 'Real-time optimization', 'Weekly brand reports'] },
        { name: 'Phase 2 \u2014 Scale', days: 15, color: '#22C55E', tasks: ['Top 50% continue', '15 additional videos each', 'Scale winning content angles', 'Final performance report'] },
      ];

      const formatCurrency = (amount) =>
        new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount);

      // ─── Icon Component ──────────────────────────────────────────
      function Icon({ name, size = 20, className = '' }) {
        const ref = useRef(null);
        useEffect(() => {
          if (ref.current) {
            ref.current.innerHTML = '';
            const el = lucide.createElement(lucide.icons[name]);
            if (el) {
              el.setAttribute('width', size);
              el.setAttribute('height', size);
              ref.current.appendChild(el);
            }
          }
        }, [name, size]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
      }

      // ─── Animated Counter ────────────────────────────────────────
      function useAnimatedCounter(end, duration = 1500) {
        const [count, setCount] = useState(0);
        const ref = useRef(null);
        const started = useRef(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting && !started.current) {
              started.current = true;
              let startTime;
              const animate = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 4);
                setCount(Math.floor(end * eased));
                if (progress < 1) requestAnimationFrame(animate);
              };
              requestAnimationFrame(animate);
            }
          }, { threshold: 0.3 });
          if (ref.current) observer.observe(ref.current);
          return () => observer.disconnect();
        }, [end, duration]);

        return [count, ref];
      }

      // ─── Nav Bar ─────────────────────────────────────────────────
      function NavBar({ onContactClick }) {
        const [scrolled, setScrolled] = useState(false);
        useEffect(() => {
          const handler = () => setScrolled(window.scrollY > 20);
          window.addEventListener('scroll', handler);
          return () => window.removeEventListener('scroll', handler);
        }, []);

        return (
          <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'glass-panel shadow-lg' : 'bg-transparent'}`}>
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-accent-teal to-accent-purple flex items-center justify-center font-bold text-sm text-titan-bg">T</div>
                <span className="text-lg font-bold text-text-primary tracking-tight">TITANS</span>
                <span className="text-xs text-text-muted font-medium tracking-widest uppercase ml-1 hidden sm:inline">Agency</span>
              </div>
              <div className="flex items-center gap-4">
                <a href="#how-it-works" className="text-sm text-text-secondary hover:text-text-primary transition-colors hidden sm:inline">How It Works</a>
                <a href="#pricing" className="text-sm text-text-secondary hover:text-text-primary transition-colors hidden sm:inline">Pricing</a>
                <button onClick={onContactClick} className="px-5 py-2 text-sm font-semibold bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg rounded-lg hover:opacity-90 transition-opacity">
                  Contact Sales
                </button>
              </div>
            </div>
          </nav>
        );
      }

      // ─── Hero Section ────────────────────────────────────────────
      function Hero() {
        const [creatorsCount, creatorsRef] = useAnimatedCounter(200);
        const [videosCount, videosRef] = useAnimatedCounter(5000);
        const [gmvCount, gmvRef] = useAnimatedCounter(2);

        return (
          <section className="relative pt-32 pb-20 px-6 overflow-hidden">
            {/* Background glow */}
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-gradient-to-b from-accent-teal/5 to-transparent rounded-full blur-3xl pointer-events-none" />
            <div className="absolute top-20 right-1/4 w-[300px] h-[300px] bg-accent-purple/5 rounded-full blur-3xl pointer-events-none" />

            <div className="max-w-4xl mx-auto text-center relative z-10">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-titan-border-light bg-titan-surface/50 text-xs text-text-secondary mb-8">
                <span className="w-2 h-2 rounded-full bg-accent-teal animate-pulse-glow" />
                TikTok Shop Creator Campaigns
              </div>

              <h1 className="text-4xl sm:text-5xl md:text-6xl font-bold leading-tight mb-6">
                Retainer Campaigns<br />
                <span className="text-gradient">Built to Scale</span>
              </h1>

              <p className="text-lg text-text-secondary max-w-2xl mx-auto mb-12 leading-relaxed">
                We match your brand with vetted TikTok Shop creators, manage the entire campaign,
                and deliver real results \u2014 all on a fixed retainer. No guesswork, no wasted budget.
              </p>

              {/* Stats */}
              <div className="grid grid-cols-3 gap-6 max-w-lg mx-auto">
                <div ref={creatorsRef} className="text-center">
                  <div className="text-3xl font-bold text-gradient">{creatorsCount}+</div>
                  <div className="text-xs text-text-muted mt-1">Vetted Creators</div>
                </div>
                <div ref={videosRef} className="text-center">
                  <div className="text-3xl font-bold text-gradient">{videosCount.toLocaleString()}+</div>
                  <div className="text-xs text-text-muted mt-1">Videos Delivered</div>
                </div>
                <div ref={gmvRef} className="text-center">
                  <div className="text-3xl font-bold text-gradient">${gmvCount}M+</div>
                  <div className="text-xs text-text-muted mt-1">GMV Generated</div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      // ─── How It Works ────────────────────────────────────────────
      function HowItWorks() {
        return (
          <section id="how-it-works" className="py-20 px-6">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-16">
                <h2 className="text-3xl sm:text-4xl font-bold mb-4">How a Campaign Works</h2>
                <p className="text-text-secondary max-w-xl mx-auto">Three structured phases over {CAMPAIGN_DURATION} days, fully managed by our team.</p>
              </div>

              <div className="grid md:grid-cols-3 gap-6">
                {PHASES.map((phase, i) => (
                  <div key={i} className="relative glass-panel rounded-xl overflow-hidden group hover:border-titan-border-light transition-all">
                    {/* Phase color bar */}
                    <div className="h-1 w-full" style={{ background: phase.color }} />

                    <div className="p-6">
                      <div className="flex items-center justify-between mb-4">
                        <span className="text-xs font-semibold tracking-wider uppercase" style={{ color: phase.color }}>
                          {phase.name}

                        <span className="text-xs text-text-muted bg-titan-bg px-2 py-1 rounded-md">{phase.days} days</span>
                      </div>

                      <ul className="space-y-3">
                        {phase.tasks.map((task, j) => (
                          <li key={j} className="flex items-start gap-3 text-sm text-text-secondary">
                            <span className="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style={{ background: phase.color }} />
                            {task}
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                ))}
              </div>

              {/* Timeline bar */}
              <div className="mt-10 glass-panel rounded-xl p-6">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs text-text-muted font-medium">CAMPAIGN TIMELINE</span>
                  <span className="text-xs text-text-muted">{CAMPAIGN_DURATION} days total</span>
                </div>
                <div className="flex rounded-lg overflow-hidden h-3">
                  <div className="h-full" style={{ width: `${(14/44)*100}%`, background: '#8B5CF6' }} title="Onboarding: 14 days" />
                  <div className="h-full" style={{ width: `${(15/44)*100}%`, background: '#00F2EA' }} title="Phase 1: 15 days" />
                  <div className="h-full" style={{ width: `${(15/44)*100}%`, background: '#22C55E' }} title="Phase 2: 15 days" />
                </div>
                <div className="flex mt-2">
                  <div className="text-xs text-text-muted" style={{ width: `${(14/44)*100}%` }}>14d</div>
                  <div className="text-xs text-text-muted" style={{ width: `${(15/44)*100}%` }}>15d</div>
                  <div className="text-xs text-text-muted" style={{ width: `${(15/44)*100}%` }}>15d</div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      // ─── Campaign Pricing ────────────────────────────────────────
      function Pricing({ onContactClick }) {
        const [selected, setSelected] = useState(10);
        const config = CAMPAIGN_CONFIGS[selected];

        return (
          <section id="pricing" className="py-20 px-6">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-3xl sm:text-4xl font-bold mb-4">Campaign Packages</h2>
                <p className="text-text-secondary max-w-xl mx-auto">Choose your creator count. Everything else is handled by us.</p>
              </div>

              {/* Tier selector */}
              <div className="flex justify-center gap-3 mb-12">
                {[5, 10, 15].map((count) => (
                  <button
                    key={count}
                    onClick={() => setSelected(count)}
                    className={`px-6 py-3 rounded-xl text-sm font-semibold transition-all ${
                      selected === count
                        ? 'bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg shadow-lg glow-teal'

                  <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
                    <div>
                      <div className="text-sm text-text-muted font-medium mb-1">{selected}-Creator Campaign</div>
                      <div className="text-4xl font-bold text-gradient">{formatCurrency(config.totalCost)}</div>
                      <div className="text-sm text-text-muted mt-1">{CAMPAIGN_DURATION} days \u00B7 {config.totalVideos} total videos</div>
                    </div>
                    <button
                      onClick={onContactClick}
                      className="px-8 py-3 bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg font-semibold rounded-xl hover:opacity-90 transition-opacity whitespace-nowrap"
                    >
                      Get Started
                    </button>
                  </div>
                </div>

                {/* Breakdown */}
                <div className="grid sm:grid-cols-3 divide-y sm:divide-y-0 sm:divide-x divide-titan-border">
                  <div className="p-6 text-center">
                    <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">Management Fee</div>
                    <div className="text-2xl font-bold text-text-primary">{formatCurrency(config.managementFee)}</div>
                    <div className="text-xs text-text-muted mt-1">Agency operations</div>
                  </div>
                  <div className="p-6 text-center">
                    <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">Creator Retainers</div>
                    <div className="text-2xl font-bold text-text-primary">{formatCurrency(config.retainerBudget)}</div>

                    <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">Upfront Payment</div>
                    <div className="text-2xl font-bold" style={{ color: '#00F2EA' }}>{formatCurrency(config.upfrontPayment)}</div>
                    <div className="text-xs text-text-muted mt-1">50% retainer + mgmt</div>

                </div>

                {/* What's included */}
                <div className="p-6 border-t border-titan-border bg-titan-bg/30">
                  <div className="text-xs text-text-muted font-medium mb-4 uppercase tracking-wider">What's Included</div>
                  <div className="grid sm:grid-cols-2 gap-3">
                    {[
                      `${config.totalVideos} total videos over ${CAMPAIGN_DURATION} days`,
                      'Creator sourcing & vetting',
                      'Sample shipping coordination',
                      'Spark Ad code collection',
                      'Weekly performance reports',
                      'Phase 2 scaling with top performers',
                      'Dedicated campaign manager',
                      'Content strategy & briefs',
                    ].map((item, i) => (
                      <div key={i} className="flex items-center gap-2 text-sm text-text-secondary">
                        <span className="w-4 h-4 rounded-full bg-accent-teal/10 flex items-center justify-center flex-shrink-0">
                          <span className="w-1.5 h-1.5 rounded-full bg-accent-teal" />
                        </span>
                        {item}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      // ─── Deliverables Section ────────────────────────────────────
      function Deliverables() {
        const items = [
          { icon: 'Video', title: 'UGC Content', desc: 'Authentic short-form videos from creators already thriving on TikTok Shop.' },
          { icon: 'Zap', title: 'Spark Ad Codes', desc: 'Every video comes with a Spark Ad code so you can run paid ads on top-performing content.' },
          { icon: 'BarChart3', title: 'Performance Reports', desc: 'Weekly reports on GMV, views, orders, and creator performance.' },
          { icon: 'Target', title: 'Scaling Strategy', desc: 'Phase 2 doubles down on your best performers to maximize ROI.' },
        ];

        return (
          <section className="py-20 px-6">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-3xl sm:text-4xl font-bold mb-4">What You Get</h2>
                <p className="text-text-secondary max-w-xl mx-auto">Every campaign delivers tangible assets your brand can use long after the campaign ends.</p>
              </div>

              <div className="grid sm:grid-cols-2 gap-6">
                {items.map((item, i) => (
                  <div key={i} className="glass-panel rounded-xl p-6 hover:border-titan-border-light transition-all group">
                    <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-accent-teal/10 to-accent-purple/10 border border-titan-border flex items-center justify-center mb-4 group-hover:border-accent-teal/30 transition-colors">
                      <Icon name={item.icon} size={18} className="text-accent-teal" />
                    </div>
                    <h3 className="text-lg font-semibold text-text-primary mb-2">{item.title}</h3>
                    <p className="text-sm text-text-secondary leading-relaxed">{item.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // ─── FAQ Section ─────────────────────────────────────────────
      function FAQ() {
        const [open, setOpen] = useState(null);
        const faqs = [
          { q: 'How do you source creators?', a: 'We have a network of 200+ vetted TikTok Shop creators. We match creators to your brand based on niche, content style, audience demographics, and past performance on similar products.' },
          { q: 'What happens after the 44 days?', a: 'You keep all the content and Spark Ad codes. Many brands choose to re-engage top performers on a rolling basis or launch a new campaign cycle.' },
          { q: 'Do I need a TikTok Shop already?', a: 'Yes \u2014 you need an active TikTok Shop with products listed. We handle everything else from there.' },
          { q: 'What if a creator underperforms?', a: 'Phase 2 is designed exactly for this. We cut the bottom 50% and redistribute volume to your top-performing creators, so budget always flows to what works.' },
          { q: 'How is the retainer paid to creators?', a: '50% of the creator retainer budget is paid upfront alongside the management fee. The remaining 50% is paid at the start of Phase 2 to creators who advance.' },
          { q: 'Can I review content before it goes live?', a: 'Yes. During onboarding we establish a review workflow so your team can approve or request edits before any video is posted.' },
        ];

        return (
          <section className="py-20 px-6">
            <div className="max-w-2xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-3xl sm:text-4xl font-bold mb-4">Questions</h2>
              </div>

              <div className="space-y-3">
                {faqs.map((faq, i) => (
                  <div key={i} className="glass-panel rounded-xl overflow-hidden">
                    <button
                      onClick={() => setOpen(open === i ? null : i)}
                      className="w-full flex items-center justify-between p-5 text-left"
                    >
                      <span className="text-sm font-medium text-text-primary pr-4">{faq.q}</span>
                      <span className={`text-text-muted transition-transform ${open === i ? 'rotate-45' : ''}`}>+</span>
                    </button>
                    {open === i && (
                      <div className="px-5 pb-5 text-sm text-text-secondary leading-relaxed border-t border-titan-border pt-4">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // ─── Contact Modal ───────────────────────────────────────────
      function ContactModal({ isOpen, onClose }) {
        const [copied, setCopied] = useState(null);
        const email = 'tiktoktitansmanagement@gmail.com';
        const whatsapp = '7403570482';

        if (!isOpen) return null;

        const copyToClipboard = (text, type) => {
          navigator.clipboard.writeText(text);
          setCopied(type);
          setTimeout(() => setCopied(null), 2000);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
            <div className="relative glass-panel rounded-2xl w-full max-w-md shadow-2xl glow-purple animate-fade-in-up">
              <button onClick={onClose} className="absolute top-4 right-4 text-text-muted hover:text-text-primary transition-colors text-xl">&times;</button>

              <div className="p-6 pb-4 border-b border-titan-border">
                <h3 className="text-xl font-bold text-text-primary">Get In Touch</h3>
                <p className="text-sm text-text-secondary mt-1">Ready to launch a campaign? Reach out below.</p>
              </div>

              <div className="p-6 space-y-4">
                {/* Email */}
                <div className="glass-panel rounded-xl p-4">
                  <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">Email</div>
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-text-primary font-medium truncate pr-3">{email}</span>
                    <button
                      onClick={() => copyToClipboard(email, 'email')}
                      className="px-3 py-1.5 text-xs font-medium rounded-lg bg-accent-teal/10 text-accent-teal hover:bg-accent-teal/20 transition-colors whitespace-nowrap"
                    >
                      {copied === 'email' ? 'Copied!' : 'Copy'}
                    </button>
                  </div>
                </div>

                {/* WhatsApp */}
                <div className="glass-panel rounded-xl p-4">
                  <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">WhatsApp</div>
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-text-primary font-medium">{whatsapp}</span>
                    <button
                      onClick={() => copyToClipboard(whatsapp, 'phone')}
                      className="px-3 py-1.5 text-xs font-medium rounded-lg bg-accent-purple/10 text-accent-purple hover:bg-accent-purple/20 transition-colors whitespace-nowrap"
                    >
                      {copied === 'phone' ? 'Copied!' : 'Copy'}
                    </button>
                  </div>
                </div>

                {/* Direct links */}
                <div className="flex gap-3 pt-2">
                  <a
                    href={`mailto:${email}`}
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg rounded-xl hover:opacity-90 transition-opacity"
                  >
                    <Icon name="Mail" size={16} /> Send Email
                  </a>
                  <a
                    href={`https://wa.me/1${whatsapp}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold border border-titan-border-light text-text-primary rounded-xl hover:bg-titan-surface transition-colors"
                  >
                    <Icon name="MessageCircle" size={16} /> WhatsApp
                  </a>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ─── Footer ──────────────────────────────────────────────────
      function Footer({ onContactClick }) {
        return (
          <footer className="border-t border-titan-border py-16 px-6">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl sm:text-3xl font-bold mb-4">Ready to launch your campaign?</h2>
                <p className="text-text-secondary mb-8">Get matched with creators and start driving sales in under 2 weeks.</p>
                <button
                  onClick={onContactClick}
                  className="px-8 py-3 bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg font-semibold rounded-xl hover:opacity-90 transition-opacity text-sm"
                >
                  Contact Sales
                </button>
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-between pt-8 border-t border-titan-border text-xs text-text-muted">
                <div className="flex items-center gap-2 mb-2 sm:mb-0">
                  <div className="w-6 h-6 rounded bg-gradient-to-br from-accent-teal to-accent-purple flex items-center justify-center font-bold text-[10px] text-titan-bg">T</div>
                  <span>Titans Agency</span>
                </div>
                <div>&copy; {new Date().getFullYear()} Titans Agency. All rights reserved.</div>
              </div>
            </div>
          </footer>
        );
      }

      // ─── App ─────────────────────────────────────────────────────
      function App() {
        const [contactOpen, setContactOpen] = useState(false);
        const openContact = useCallback(() => setContactOpen(true), []);
        const closeContact = useCallback(() => setContactOpen(false), []);

        return (
          <div className="min-h-screen bg-titan-bg">
            <NavBar onContactClick={openContact} />
            <Hero />
            <HowItWorks />
            <Deliverables />
            <Pricing onContactClick={openContact} />
            <FAQ />
            <Footer onContactClick={openContact} />
            <ContactModal isOpen={contactOpen} onClose={closeContact} />
          </div>
        );
      }

      // ─── Mount ───────────────────────────────────────────────────
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
