      // ─── Animated Counter ────────────────────────────────────────
      function useAnimatedCounter(end, duration = 1500) {
        const [count, setCount] = useState(0);
        const ref = useRef(null);
        const started = useRef(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting && !started.current) {
              started.current = true;
              let startTime;
              const animate = (timestamp) => {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 4);
                setCount(Math.floor(end * eased));
                if (progress < 1) requestAnimationFrame(animate);
              };
              requestAnimationFrame(animate);
            }
          }, { threshold: 0.3 });
          if (ref.current) observer.observe(ref.current);
          return () => observer.disconnect();
        }, [end, duration]);

        return [count, ref];
      }

        ];

        return (
          <section id="faq" className="py-20 px-6 border-t border-titan-border scroll-mt-28">
            <div className="max-w-2xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-3xl sm:text-4xl font-bold mb-4">Creator FAQ</h2>
                <p className="text-text-secondary text-sm mt-2">Straight answers—no brand deck.</p>
              </div>

              <div className="space-y-3">
                {faqs.map((faq, i) => (
                  <div key={i} className="glass-panel rounded-xl overflow-hidden">
                    <button
                      onClick={() => setOpen(open === i ? null : i)}
                      className="w-full flex items-center justify-between p-5 text-left"
                    >
                      <span className="text-sm font-medium text-text-primary pr-4">{faq.q}</span>
                      <span className={`text-text-muted transition-transform ${open === i ? 'rotate-45' : ''}`}>+</span>
                    </button>
                    {open === i && (
                      <div className="px-5 pb-5 text-sm text-text-secondary leading-relaxed border-t border-titan-border pt-4">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // ─── Contact Modal ───────────────────────────────────────────
      function ContactModal({ isOpen, onClose }) {
        const [copied, setCopied] = useState(null);
        const email = 'tiktoktitansmanagement@gmail.com';
        const whatsapp = '7403570482';

        if (!isOpen) return null;

        const copyToClipboard = (text, type) => {
          navigator.clipboard.writeText(text);
          setCopied(type);
          setTimeout(() => setCopied(null), 2000);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
            <div className="relative glass-panel rounded-2xl w-full max-w-md shadow-2xl glow-purple animate-fade-in-up">
              <button onClick={onClose} className="absolute top-4 right-4 text-text-muted hover:text-text-primary transition-colors text-xl">&times;</button>

              <div className="p-6 pb-4 border-b border-titan-border">
                <h3 className="text-xl font-bold text-text-primary">Get in touch</h3>
                <p className="text-sm text-text-secondary mt-1">Questions about joining Titans as a creator? Reach out below.</p>
              </div>

              <div className="p-6 space-y-4">
                {/* Email */}
                <div className="glass-panel rounded-xl p-4">
                  <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">Email</div>
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-text-primary font-medium truncate pr-3">{email}</span>
                    <button
                      onClick={() => copyToClipboard(email, 'email')}
                      className="px-3 py-1.5 text-xs font-medium rounded-lg bg-accent-teal/10 text-accent-teal hover:bg-accent-teal/20 transition-colors whitespace-nowrap"
                    >
                      {copied === 'email' ? 'Copied!' : 'Copy'}
                    </button>
                  </div>
                </div>

                {/* WhatsApp */}
                <div className="glass-panel rounded-xl p-4">
                  <div className="text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">WhatsApp</div>
                  <div className="flex items-center justify-between">
                    <span className="text-sm text-text-primary font-medium">{whatsapp}</span>
                    <button
                      onClick={() => copyToClipboard(whatsapp, 'phone')}
                      className="px-3 py-1.5 text-xs font-medium rounded-lg bg-accent-purple/10 text-accent-purple hover:bg-accent-purple/20 transition-colors whitespace-nowrap"
                    >
                      {copied === 'phone' ? 'Copied!' : 'Copy'}
                    </button>
                  </div>
                </div>

                {/* Direct links */}
                <div className="flex gap-3 pt-2">
                  <a
                    href={`mailto:${email}`}
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg rounded-xl hover:opacity-90 transition-opacity"
                  >
                    <Icon name="Mail" size={16} /> Send Email
                  </a>
                  <a
                    href={`https://wa.me/1${whatsapp}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold border border-titan-border-light text-text-primary rounded-xl hover:bg-titan-surface transition-colors"
                  >
                    <Icon name="MessageCircle" size={16} /> WhatsApp
                  </a>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ─── Footer ──────────────────────────────────────────────────
      function Footer({ onContactClick }) {
        return (
          <footer className="border-t border-titan-border py-16 px-6">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-2xl sm:text-3xl font-bold mb-4">Ready to join TikTok Titans?</h2>
                <p className="text-text-secondary mb-8 max-w-md mx-auto">Apply by email, say hi on WhatsApp, or jump into Discord when the link is live—we read creator messages first.</p>
                <button
                  onClick={onContactClick}
                  className="px-8 py-3 bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg font-semibold rounded-xl hover:opacity-90 transition-opacity text-sm"
                >
                  Get in touch
                </button>
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-8 border-t border-titan-border text-xs text-text-muted">
                <div className="flex items-center gap-3 mb-2 sm:mb-0">
                  <img src="assets/icon.png" alt="" className="w-8 h-8 rounded-lg object-cover ring-1 ring-titan-border-light" />
                  <div>
                    <div className="text-text-primary font-medium">TikTok Titans</div>
                    <a href="/tracker/" className="text-accent-teal hover:underline">Tracker login</a>
                    <span className="text-text-muted"> · </span>
                    <a href="#join" className="hover:text-text-primary">Join</a>
                  </div>
                </div>
                <div>&copy; {new Date().getFullYear()} TikTok Titans. All rights reserved.</div>
              </div>
            </div>
          </footer>
        );
      }

      // ─── App ─────────────────────────────────────────────────────
      function App() {
        const [contactOpen, setContactOpen] = useState(false);
        const openContact = useCallback(() => setContactOpen(true), []);
        const closeContact = useCallback(() => setContactOpen(false), []);

        return (
          <div className="min-h-screen bg-titan-bg">
            <NavBar onContactClick={openContact} />
            <HeroDiscover />
            <FeaturesDiscover />
            <CreatorJourney />
            <TeamTitans />
            <JoinCTA />
            <FAQ />
            <Footer onContactClick={openContact} />
            <ContactModal isOpen={contactOpen} onClose={closeContact} />
          </div>
        );
      }

      // ─── Mount ───────────────────────────────────────────────────
      (function mount() {
        const el = document.getElementById('root');
        if (!el || !window.React || !window.ReactDOM) {
          if (el) {
            el.innerHTML =
              '<div style="padding:2rem;font-family:system-ui;max-width:40rem"><h1 style="font-size:1.25rem;margin:0 0 0.5rem">Could not load the page</h1><p style="opacity:.85;margin:0">Scripts did not load. Check your network, VPN, or ad-blocker, then refresh. The site needs React from the CDN.</p></div>';
          }
          return;
        }
        try {
          const root = ReactDOM.createRoot(el);
          root.render(<App />);
        } catch (err) {
          el.innerHTML =
            '<div style="padding:2rem;font-family:system-ui;color:#fecaca"><strong>App error</strong><pre style="white-space:pre-wrap;margin-top:1rem;font-size:12px">' +
            String(err && err.message ? err.message : err) +
            '</pre></div>';
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
