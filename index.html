<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titans Agency</title>
    <meta name="description" content="Campaign tracker for Titans Agency retainer campaigns." />
    <link rel="canonical" href="https://titansagency.co/" />
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>" />

    <script crossorigin src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              titan: { bg: '#0A0A0A', surface: '#0F0F10', elevated: '#141416', border: '#1A1A1E', 'border-light': '#2A2A2E' },
              accent: { teal: '#00F2EA', fuchsia: '#FF0050', purple: '#8B5CF6', green: '#22C55E' },
              text: { primary: '#F5F5F5', secondary: '#8A8A8A', muted: '#5A5A5A' },
            },
            fontFamily: { sans: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'] },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { font-family: 'Space Grotesk', 'Inter', sans-serif; background: #0A0A0A; color: #F5F5F5; margin: 0; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0A0A0A; }
      ::-webkit-scrollbar-thumb { background: #1A1A1E; border-radius: 3px; }
      ::selection { background: rgba(0, 242, 234, 0.3); color: #F5F5F5; }
      .glass { background: linear-gradient(135deg, rgba(20,20,22,0.7), rgba(15,15,16,0.8)); backdrop-filter: blur(12px); border: 1px solid rgba(26,26,30,0.8); }
      .teal-grad { background: linear-gradient(135deg, #00F2EA, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .glow-teal { box-shadow: 0 0 30px -10px rgba(0,242,234,0.3); }
      @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
      .fade-up { animation: fadeUp 0.5s ease-out forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      // ═══════════════════════════════════════════════════════════════
      // SPA REDIRECT (GitHub Pages 404.html trick)
      // ═══════════════════════════════════════════════════════════════
      (function() {
        const r = sessionStorage.getItem('spa-redirect');
        if (r) { sessionStorage.removeItem('spa-redirect'); window.history.replaceState(null, '', r); }
      })();

      // ═══════════════════════════════════════════════════════════════
      // CAMPAIGN CONFIGURATION
      // ═══════════════════════════════════════════════════════════════
      const DEFAULT_CAMPAIGNS = {
        'natural-stacks': { name: 'Natural Stacks', startDate: '2026-04-07', tier: 10 },
      };

      const TIER_INFO = {
        5:  { totalVideos: 120, creatorsP1: 5,  creatorsP2: 3  },
        10: { totalVideos: 225, creatorsP1: 10, creatorsP2: 5  },
        15: { totalVideos: 325, creatorsP1: 15, creatorsP2: 8  },
      };

      const VIDEOS_PER_CREATOR = 15; // per phase

      // ═══════════════════════════════════════════════════════════════
      // UTILITIES
      // ═══════════════════════════════════════════════════════════════
      function addDays(dateStr, n) {
        const d = new Date(dateStr + 'T12:00:00');
        d.setDate(d.getDate() + n);
        return d.toISOString().split('T')[0];
      }

      function fmtDate(dateStr, year = false) {
        const d = new Date(dateStr + 'T12:00:00');
        const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${m[d.getMonth()]} ${d.getDate()}${year ? ', ' + d.getFullYear() : ''}`;
      }

      function today() { return new Date().toISOString().split('T')[0]; }

      function slugify(str) {
        return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      function getPhases(startDate) {
        return {
          onboarding: { start: startDate, end: addDays(startDate, 13), label: 'Onboarding', color: '#8B5CF6' },
          phase1: { start: addDays(startDate, 14), end: addDays(startDate, 28), label: 'Phase 1 \u2014 Launch', color: '#00F2EA' },
          phase2: { start: addDays(startDate, 29), end: addDays(startDate, 43), label: 'Phase 2 \u2014 Scale', color: '#22C55E' },
        };
      }

      function getCurrentPhase(startDate) {
        const t = today();
        const p = getPhases(startDate);
        if (t < p.onboarding.start) return { key: 'upcoming', label: 'Not Started', color: '#5A5A5A' };
        if (t <= p.onboarding.end) return { key: 'onboarding', ...p.onboarding };
        if (t <= p.phase1.end) return { key: 'phase1', ...p.phase1 };
        if (t <= p.phase2.end) return { key: 'phase2', ...p.phase2 };
        return { key: 'complete', label: 'Complete', color: '#22C55E' };
      }

      function getCampaignDay(startDate) {
        const diff = Math.floor((new Date() - new Date(startDate + 'T12:00:00')) / 86400000);
        return Math.max(0, Math.min(44, diff + 1));
      }

      function getAllCampaigns() {
        const stored = JSON.parse(localStorage.getItem('titans_campaigns') || '{}');
        return { ...DEFAULT_CAMPAIGNS, ...stored };
      }

      function saveCampaign(slug, campaign) {
        const stored = JSON.parse(localStorage.getItem('titans_campaigns') || '{}');
        stored[slug] = campaign;
        localStorage.setItem('titans_campaigns', JSON.stringify(stored));
      }

      function makeSetupLink(slug, camp) {
        const data = btoa(JSON.stringify({ n: camp.name, d: camp.startDate, t: camp.tier }));
        return `${window.location.origin}/${slug}/?s=${data}`;
      }

      // ═══════════════════════════════════════════════════════════════
      // ICON COMPONENT
      // ═══════════════════════════════════════════════════════════════
      function Icon({ name, size = 18, className = '' }) {
        const ref = useRef(null);
        useEffect(() => {
          if (ref.current && lucide.icons[name]) {
            ref.current.innerHTML = '';
            const el = lucide.createElement(lucide.icons[name]);
            el.setAttribute('width', size);
            el.setAttribute('height', size);
            ref.current.appendChild(el);
          }
        }, [name, size]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
      }

      // ═══════════════════════════════════════════════════════════════
      // NAV BAR
      // ═══════════════════════════════════════════════════════════════
      function Nav({ title, subtitle, showBack }) {
        return (
          <nav className="sticky top-0 z-50 glass border-b border-titan-border">
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
              {showBack && (
                <a href="/" className="text-text-muted hover:text-text-primary transition-colors">
                  <Icon name="ArrowLeft" size={18} />
                </a>
              )}
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-teal to-accent-purple flex items-center justify-center font-bold text-xs text-titan-bg flex-shrink-0">T</div>
              <div className="min-w-0">
                <div className="text-sm font-bold text-text-primary tracking-tight truncate">{title || 'TITANS AGENCY'}</div>
                {subtitle && <div className="text-xs text-text-muted truncate">{subtitle}</div>}
              </div>
            </div>
          </nav>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // ADMIN DASHBOARD
      // ═══════════════════════════════════════════════════════════════
      function AdminDashboard() {
        const [campaigns, setCampaigns] = useState(getAllCampaigns());
        const [showForm, setShowForm] = useState(false);
        const [form, setForm] = useState({ name: '', startDate: '', tier: 10 });
        const [copied, setCopied] = useState(null);

        const handleCreate = () => {
          if (!form.name || !form.startDate) return;
          const slug = slugify(form.name);
          const camp = { name: form.name, startDate: form.startDate, tier: form.tier };
          saveCampaign(slug, camp);
          setCampaigns(getAllCampaigns());
          setShowForm(false);
          setForm({ name: '', startDate: '', tier: 10 });
        };

        const copyLink = (slug, camp) => {
          const link = makeSetupLink(slug, camp);
          navigator.clipboard.writeText(link);
          setCopied(slug);
          setTimeout(() => setCopied(null), 2000);
        };

        const entries = Object.entries(campaigns);

        return (
          <div className="min-h-screen bg-titan-bg">
            <Nav title="TITANS AGENCY" subtitle="Campaign Manager" />

            <div className="max-w-3xl mx-auto px-4 py-8">
              {/* Header */}
              <div className="flex items-center justify-between mb-8">
                <div>
                  <h1 className="text-2xl font-bold text-text-primary">Campaigns</h1>
                  <p className="text-sm text-text-muted mt-1">{entries.length} campaign{entries.length !== 1 ? 's' : ''}</p>
                </div>
                <button
                  onClick={() => setShowForm(!showForm)}
                  className="flex items-center gap-2 px-4 py-2 text-sm font-semibold bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg rounded-lg hover:opacity-90 transition-opacity"
                >
                  <Icon name={showForm ? 'X' : 'Plus'} size={16} />
                  {showForm ? 'Cancel' : 'New Campaign'}
                </button>
              </div>

              {/* Add Campaign Form */}
              {showForm && (
                <div className="glass rounded-xl p-6 mb-8 fade-up">
                  <h3 className="text-sm font-semibold text-text-primary mb-4">Create New Campaign</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs text-text-muted font-medium mb-1.5 uppercase tracking-wider">Brand Name</label>
                      <input
                        type="text"
                        value={form.name}
                        onChange={e => setForm({...form, name: e.target.value})}
                        placeholder="e.g. Natural Stacks"
                        className="w-full px-3 py-2.5 bg-titan-bg border border-titan-border rounded-lg text-sm text-text-primary placeholder-text-muted focus:outline-none focus:border-accent-teal/50"
                      />
                      {form.name && (
                        <div className="text-xs text-text-muted mt-1">URL: titansagency.co/<span className="text-accent-teal">{slugify(form.name)}</span>/</div>
                      )}
                    </div>
                    <div>
                      <label className="block text-xs text-text-muted font-medium mb-1.5 uppercase tracking-wider">Campaign Start Date</label>
                      <input
                        type="date"
                        value={form.startDate}
                        onChange={e => setForm({...form, startDate: e.target.value})}
                        className="w-full px-3 py-2.5 bg-titan-bg border border-titan-border rounded-lg text-sm text-text-primary focus:outline-none focus:border-accent-teal/50"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-text-muted font-medium mb-1.5 uppercase tracking-wider">Creator Tier</label>
                      <div className="flex gap-2">
                        {[5, 10, 15].map(t => (
                          <button
                            key={t}
                            onClick={() => setForm({...form, tier: t})}
                            className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${
                              form.tier === t
                                ? 'bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg'
                                : 'bg-titan-bg border border-titan-border text-text-secondary hover:border-titan-border-light'
                            }`}
                          >
                            {t} Creators
                          </button>
                        ))}
                      </div>
                    </div>
                    <button
                      onClick={handleCreate}
                      disabled={!form.name || !form.startDate}
                      className="w-full py-3 text-sm font-semibold bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg rounded-lg hover:opacity-90 transition-opacity disabled:opacity-40"
                    >
                      Create Campaign
                    </button>
                  </div>
                </div>
              )}

              {/* Campaign List */}
              <div className="space-y-4">
                {entries.map(([slug, camp]) => {
                  const phase = getCurrentPhase(camp.startDate);
                  const phases = getPhases(camp.startDate);
                  const day = getCampaignDay(camp.startDate);
                  const endDate = addDays(camp.startDate, 43);
                  const tierInfo = TIER_INFO[camp.tier] || TIER_INFO[10];

                  return (
                    <div key={slug} className="glass rounded-xl overflow-hidden hover:border-titan-border-light transition-all">
                      {/* Color bar */}
                      <div className="h-1 w-full" style={{ background: phase.color }} />

                      <div className="p-5">
                        <div className="flex items-start justify-between mb-3">
                          <div>
                            <h3 className="text-lg font-bold text-text-primary">{camp.name}</h3>
                            <div className="text-xs text-text-muted mt-0.5">
                              {fmtDate(camp.startDate)} \u2013 {fmtDate(endDate)} \u00B7 {camp.tier} creators
                            </div>
                          </div>
                          <span
                            className="px-2.5 py-1 text-xs font-semibold rounded-full"
                            style={{ background: phase.color + '15', color: phase.color }}
                          >
                            {phase.label}
                          </span>
                        </div>

                        {/* Progress bar */}
                        {phase.key !== 'upcoming' && (
                          <div className="mb-4">
                            <div className="flex justify-between text-xs text-text-muted mb-1">
                              <span>Day {day} of 44</span>
                              <span>{Math.round((day / 44) * 100)}%</span>
                            </div>
                            <div className="h-1.5 bg-titan-bg rounded-full overflow-hidden">
                              <div className="h-full rounded-full transition-all" style={{ width: `${(day/44)*100}%`, background: phase.color }} />
                            </div>
                          </div>
                        )}

                        {/* Actions */}
                        <div className="flex gap-2">
                          <button
                            onClick={() => copyLink(slug, camp)}
                            className="flex-1 flex items-center justify-center gap-2 px-3 py-2 text-xs font-medium rounded-lg bg-accent-teal/10 text-accent-teal hover:bg-accent-teal/20 transition-colors"
                          >
                            <Icon name={copied === slug ? 'Check' : 'Copy'} size={14} />
                            {copied === slug ? 'Copied!' : 'Copy Creator Link'}
                          </button>
                          <a
                            href={`/${slug}/`}
                            className="flex items-center justify-center gap-2 px-4 py-2 text-xs font-medium rounded-lg bg-titan-bg border border-titan-border text-text-secondary hover:text-text-primary hover:border-titan-border-light transition-all"
                          >
                            <Icon name="ExternalLink" size={14} />
                            View
                          </a>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {entries.length === 0 && (
                <div className="text-center py-16">
                  <Icon name="FolderOpen" size={40} className="text-text-muted mx-auto mb-4" />
                  <p className="text-text-muted">No campaigns yet. Create your first one above.</p>
                </div>
              )}

              {/* Footer */}
              <div className="mt-12 pt-6 border-t border-titan-border text-center text-xs text-text-muted">
                &copy; {new Date().getFullYear()} Titans Agency
              </div>
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // CREATOR NAME ENTRY
      // ═══════════════════════════════════════════════════════════════
      function NameEntry({ brandName, onSubmit }) {
        const [name, setName] = useState('');

        const handleSubmit = (e) => {
          e.preventDefault();
          if (name.trim()) onSubmit(name.trim());
        };

        return (
          <div className="min-h-screen bg-titan-bg flex items-center justify-center px-4">
            <div className="w-full max-w-sm fade-up">
              <div className="text-center mb-8">
                <div className="w-14 h-14 rounded-xl bg-gradient-to-br from-accent-teal to-accent-purple flex items-center justify-center font-bold text-xl text-titan-bg mx-auto mb-4">T</div>
                <h1 className="text-xl font-bold text-text-primary">{brandName}</h1>
                <p className="text-sm text-text-muted mt-1">Campaign Tracker by Titans Agency</p>
              </div>

              <form onSubmit={handleSubmit} className="glass rounded-xl p-6">
                <label className="block text-xs text-text-muted font-medium mb-2 uppercase tracking-wider">Your Name</label>
                <input
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder="Enter your name"
                  autoFocus
                  className="w-full px-4 py-3 bg-titan-bg border border-titan-border rounded-lg text-sm text-text-primary placeholder-text-muted focus:outline-none focus:border-accent-teal/50 mb-4"
                />
                <button
                  type="submit"
                  disabled={!name.trim()}
                  className="w-full py-3 text-sm font-semibold bg-gradient-to-r from-accent-teal to-accent-purple text-titan-bg rounded-lg hover:opacity-90 transition-opacity disabled:opacity-40"
                >
                  Open My Tracker
                </button>
              </form>

              <p className="text-center text-xs text-text-muted mt-4">Your progress is saved on this device.</p>
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // CAMPAIGN TIMELINE
      // ═══════════════════════════════════════════════════════════════
      function Timeline({ startDate }) {
        const phases = getPhases(startDate);
        const day = getCampaignDay(startDate);
        const pct = Math.min(100, Math.max(0, (day / 44) * 100));

        return (
          <div className="glass rounded-xl p-4">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs text-text-muted font-medium uppercase tracking-wider">Campaign Timeline</span>
              <span className="text-xs text-text-muted">Day {day} of 44</span>
            </div>
            {/* Bar */}
            <div className="relative">
              <div className="flex rounded-lg overflow-hidden h-2.5 bg-titan-bg">
                <div className="h-full" style={{ width: '31.8%', background: '#8B5CF6' }} />
                <div className="h-full" style={{ width: '34.1%', background: '#00F2EA' }} />
                <div className="h-full" style={{ width: '34.1%', background: '#22C55E' }} />
              </div>
              {/* Current position marker */}
              {day > 0 && day <= 44 && (
                <div
                  className="absolute top-0 w-0.5 h-2.5 bg-white rounded-full"
                  style={{ left: `${pct}%` }}
                />
              )}
            </div>
            {/* Labels */}
            <div className="flex mt-1.5 text-[10px]">
              <div className="text-text-muted" style={{ width: '31.8%' }}>Onboarding</div>
              <div style={{ width: '34.1%', color: '#00F2EA' }}>Phase 1</div>
              <div style={{ width: '34.1%', color: '#22C55E' }}>Phase 2</div>
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // PROGRESS BAR
      // ═══════════════════════════════════════════════════════════════
      function ProgressStats({ done, total }) {
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
        return (
          <div className="glass rounded-xl p-4">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs text-text-muted font-medium uppercase tracking-wider">Your Progress</span>
              <span className="text-sm font-bold teal-grad">{done}/{total} videos</span>
            </div>
            <div className="h-2 bg-titan-bg rounded-full overflow-hidden">
              <div
                className="h-full rounded-full transition-all duration-500"
                style={{ width: `${pct}%`, background: 'linear-gradient(90deg, #00F2EA, #8B5CF6)' }}
              />
            </div>
            <div className="text-right text-xs text-text-muted mt-1">{pct}% complete</div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // VIDEO ROW
      // ═══════════════════════════════════════════════════════════════
      function VideoRow({ videoKey, num, dueDate, data, onToggle, onUpdateLink, color }) {
        const [showLink, setShowLink] = useState(false);
        const isDone = data?.done;
        const t = today();
        const isToday = dueDate === t;
        const isPast = dueDate < t;

        return (
          <div className={`rounded-lg transition-all ${isDone ? 'bg-titan-surface/50' : ''}`}>
            <div className="flex items-center gap-3 px-3 py-2.5">
              {/* Checkbox bubble */}
              <button
                onClick={() => onToggle(videoKey)}
                className={`w-7 h-7 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all ${
                  isDone
                    ? 'border-transparent'
                    : isToday
                    ? 'border-accent-teal/50 hover:border-accent-teal'
                    : 'border-titan-border-light hover:border-text-muted'
                }`}
                style={isDone ? { background: color } : {}}
              >
                {isDone && <Icon name="Check" size={14} className="text-titan-bg" />}
              </button>

              {/* Info */}
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span className={`text-sm font-medium ${isDone ? 'text-text-muted line-through' : 'text-text-primary'}`}>
                    Video {num}
                  </span>
                  {isToday && !isDone && (
                    <span className="px-1.5 py-0.5 text-[10px] font-semibold rounded bg-accent-teal/15 text-accent-teal">TODAY</span>
                  )}
                </div>
                <div className="text-xs text-text-muted">
                  {isDone ? `Posted ${fmtDate(data.date)}` : `Due ${fmtDate(dueDate)}`}
                </div>
              </div>

              {/* Link toggle */}
              <button
                onClick={() => setShowLink(!showLink)}
                className={`p-1.5 rounded-md transition-colors ${
                  data?.link ? 'text-accent-teal' : 'text-text-muted hover:text-text-secondary'
                }`}
              >
                <Icon name="Link" size={14} />
              </button>
            </div>

            {/* Link input (expandable) */}
            {showLink && (
              <div className="px-3 pb-3 pl-[52px]">
                <input
                  type="url"
                  value={data?.link || ''}
                  onChange={e => onUpdateLink(videoKey, e.target.value)}
                  placeholder="Paste TikTok video link..."
                  className="w-full px-3 py-2 bg-titan-bg border border-titan-border rounded-lg text-xs text-text-primary placeholder-text-muted focus:outline-none focus:border-accent-teal/30"
                />
              </div>
            )}
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // PHASE SECTION
      // ═══════════════════════════════════════════════════════════════
      function PhaseSection({ title, dateRange, color, videos, videoData, onToggle, onUpdateLink, locked }) {
        const doneInPhase = videos.filter(v => videoData[v.key]?.done).length;

        return (
          <div className="glass rounded-xl overflow-hidden">
            <div className="h-1 w-full" style={{ background: color }} />
            <div className="p-4">
              <div className="flex items-center justify-between mb-1">
                <h3 className="text-sm font-bold" style={{ color }}>{title}</h3>
                <span className="text-xs text-text-muted">{doneInPhase}/{videos.length}</span>
              </div>
              <div className="text-xs text-text-muted mb-3">{dateRange}</div>

              {locked ? (
                <div className="flex items-center gap-2 py-4 justify-center text-text-muted">
                  <Icon name="Lock" size={16} />
                  <span className="text-sm">Opens {fmtDate(videos[0]?.due)}</span>
                </div>
              ) : (
                <div className="space-y-0.5">
                  {videos.map(v => (
                    <VideoRow
                      key={v.key}
                      videoKey={v.key}
                      num={v.num}
                      dueDate={v.due}
                      data={videoData[v.key]}
                      onToggle={onToggle}
                      onUpdateLink={onUpdateLink}
                      color={color}
                    />
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // CREATOR TRACKER (main creator view)
      // ═══════════════════════════════════════════════════════════════
      function CreatorTracker({ slug }) {
        const [campaign, setCampaign] = useState(null);
        const [creator, setCreator] = useState('');
        const [videos, setVideos] = useState({});
        const [loaded, setLoaded] = useState(false);

        // Load campaign config (from hardcoded, localStorage, or setup link)
        useEffect(() => {
          // Check for setup link param
          const params = new URLSearchParams(window.location.search);
          const s = params.get('s');
          if (s) {
            try {
              const c = JSON.parse(atob(s));
              const camp = { name: c.n, startDate: c.d, tier: c.t };
              saveCampaign(slug, camp);
              window.history.replaceState(null, '', window.location.pathname);
              setCampaign(camp);
              setLoaded(true);
              return;
            } catch (e) { /* ignore bad data */ }
          }

          const all = getAllCampaigns();
          if (all[slug]) {
            setCampaign(all[slug]);
          }
          setLoaded(true);
        }, [slug]);

        // Load creator data from localStorage
        useEffect(() => {
          if (!campaign) return;
          const savedName = localStorage.getItem(`t_${slug}_name`);
          if (savedName) setCreator(savedName);
          const savedVids = localStorage.getItem(`t_${slug}_vids`);
          if (savedVids) {
            try { setVideos(JSON.parse(savedVids)); } catch(e) {}
          }
        }, [campaign, slug]);

        // Save videos to localStorage
        const saveVideos = useCallback((newVids) => {
          setVideos(newVids);
          localStorage.setItem(`t_${slug}_vids`, JSON.stringify(newVids));
        }, [slug]);

        const toggleVideo = useCallback((key) => {
          setVideos(prev => {
            const next = { ...prev };
            if (next[key]?.done) {
              next[key] = { ...next[key], done: false };
            } else {
              next[key] = { ...(next[key] || {}), done: true, date: today() };
            }
            localStorage.setItem(`t_${slug}_vids`, JSON.stringify(next));
            return next;
          });
        }, [slug]);

        const updateLink = useCallback((key, link) => {
          setVideos(prev => {
            const next = { ...prev };
            next[key] = { ...(next[key] || {}), link };
            localStorage.setItem(`t_${slug}_vids`, JSON.stringify(next));
            return next;
          });
        }, [slug]);

        const handleNameSubmit = (name) => {
          localStorage.setItem(`t_${slug}_name`, name);
          setCreator(name);
        };

        if (!loaded) return null;
        if (!campaign) return <NotFound slug={slug} />;
        if (!creator) return <NameEntry brandName={campaign.name} onSubmit={handleNameSubmit} />;

        const phases = getPhases(campaign.startDate);
        const t = today();

        const p1Videos = Array.from({ length: VIDEOS_PER_CREATOR }, (_, i) => ({
          key: `p1-${i + 1}`,
          num: i + 1,
          due: addDays(campaign.startDate, 14 + i),
        }));

        const p2Videos = Array.from({ length: VIDEOS_PER_CREATOR }, (_, i) => ({
          key: `p2-${i + 1}`,
          num: i + 1,
          due: addDays(campaign.startDate, 29 + i),
        }));

        const allVideoKeys = [...p1Videos, ...p2Videos].map(v => v.key);
        const doneCount = allVideoKeys.filter(k => videos[k]?.done).length;

        return (
          <div className="min-h-screen bg-titan-bg">
            <Nav title={campaign.name} subtitle={`Hi, ${creator}`} showBack={false} />

            <div className="max-w-lg mx-auto px-4 py-6 space-y-4">
              <Timeline startDate={campaign.startDate} />
              <ProgressStats done={doneCount} total={allVideoKeys.length} />

              <PhaseSection
                title="Phase 1 \u2014 Launch"
                dateRange={`${fmtDate(phases.phase1.start)} \u2013 ${fmtDate(phases.phase1.end)}`}
                color="#00F2EA"
                videos={p1Videos}
                videoData={videos}
                onToggle={toggleVideo}
                onUpdateLink={updateLink}
                locked={t < phases.phase1.start}
              />

              <PhaseSection
                title="Phase 2 \u2014 Scale"
                dateRange={`${fmtDate(phases.phase2.start)} \u2013 ${fmtDate(phases.phase2.end)}`}
                color="#22C55E"
                videos={p2Videos}
                videoData={videos}
                onToggle={toggleVideo}
                onUpdateLink={updateLink}
                locked={t < phases.phase2.start}
              />

              {/* Change creator name */}
              <div className="text-center pt-4 pb-8">
                <button
                  onClick={() => { localStorage.removeItem(`t_${slug}_name`); setCreator(''); }}
                  className="text-xs text-text-muted hover:text-text-secondary transition-colors"
                >
                  Not {creator}? Switch account
                </button>
              </div>

              <div className="text-center pb-6 text-xs text-text-muted">
                &copy; {new Date().getFullYear()} Titans Agency
              </div>
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // NOT FOUND
      // ═══════════════════════════════════════════════════════════════
      function NotFound({ slug }) {
        return (
          <div className="min-h-screen bg-titan-bg flex items-center justify-center px-4">
            <div className="text-center fade-up">
              <div className="w-14 h-14 rounded-xl bg-titan-surface border border-titan-border flex items-center justify-center mx-auto mb-4">
                <Icon name="SearchX" size={24} className="text-text-muted" />
              </div>
              <h1 className="text-xl font-bold text-text-primary mb-2">Campaign Not Found</h1>
              <p className="text-sm text-text-muted mb-6">
                No campaign found for "<span className="text-text-secondary">{slug}</span>".
                <br />Make sure you have the correct link from your campaign manager.
              </p>
              <a href="/" className="text-sm text-accent-teal hover:underline">Go to Dashboard</a>
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════
      // APP ROUTER
      // ═══════════════════════════════════════════════════════════════
      function App() {
        const path = window.location.pathname.replace(/\/+$/, '') || '/';

        if (path === '/') {
          return <AdminDashboard />;
        }

        // Extract slug from path (e.g. /natural-stacks -> natural-stacks)
        const slug = path.slice(1).toLowerCase().split('/')[0];
        return <CreatorTracker slug={slug} />;
      }

      // ═══════════════════════════════════════════════════════════════
      // MOUNT
      // ═══════════════════════════════════════════════════════════════
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
