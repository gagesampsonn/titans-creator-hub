<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/titans-logo.png" />
    <link rel="apple-touch-icon" href="/titans-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titans Creator Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Core Dark Theme
              titan: {
                bg: '#0A0A0A',
                surface: '#0F0F10',
                elevated: '#141416',
                border: '#1A1A1E',
                'border-light': '#2A2A2E',
              },
              // Accent Colors
              accent: {
                teal: '#00F2EA',
                fuchsia: '#FF0050',
                orange: '#FF7A1A',
              },
              // Text Colors
              text: {
                primary: '#F5F5F5',
                secondary: '#8A8A8A',
                muted: '#5A5A5A',
              },
            },
            fontFamily: {
              sans: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            borderRadius: {
              'sm': '4px',
              'DEFAULT': '6px',
              'md': '6px',
              'lg': '8px',
            },
            boxShadow: {
              'glow-teal': '0 0 20px -5px rgba(0, 242, 234, 0.15)',
              'glow-fuchsia': '0 0 20px -5px rgba(255, 0, 80, 0.15)',
              'subtle': '0 2px 8px -2px rgba(0, 0, 0, 0.5)',
              'card': '0 4px 24px -4px rgba(0, 0, 0, 0.4)',
            },
            backgroundImage: {
              'glass': 'linear-gradient(135deg, rgba(20, 20, 22, 0.8) 0%, rgba(15, 15, 16, 0.9) 100%)',
              'glass-subtle': 'linear-gradient(180deg, rgba(26, 26, 30, 0.5) 0%, rgba(20, 20, 22, 0.3) 100%)',
              'gradient-radial': 'radial-gradient(ellipse at center, var(--tw-gradient-stops))',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              glow: {
                '0%': { opacity: '0.5' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      body { 
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        background: #0A0A0A;
        color: #F5F5F5;
      }
      
      /* Premium Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0A0A0A;
      }
      ::-webkit-scrollbar-thumb {
        background: #1A1A1E;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2A2A2E;
      }
      
      /* Glass Panel Effect */
      .glass-panel {
        background: linear-gradient(135deg, rgba(20, 20, 22, 0.7) 0%, rgba(15, 15, 16, 0.8) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(26, 26, 30, 0.8);
      }
      
      /* Accent Border Glow */
      .border-glow-teal {
        box-shadow: inset 0 0 0 1px rgba(0, 242, 234, 0.1), 0 0 20px -10px rgba(0, 242, 234, 0.2);
      }
      
      .border-glow-fuchsia {
        box-shadow: inset 0 0 0 1px rgba(255, 0, 80, 0.1), 0 0 20px -10px rgba(255, 0, 80, 0.2);
      }
      
      /* Text Gradient */
      .text-gradient-teal {
        background: linear-gradient(135deg, #00F2EA 0%, #00D4FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .text-gradient-fuchsia {
        background: linear-gradient(135deg, #FF0050 0%, #FF4D7D 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      /* Thin Accent Line */
      .accent-line-teal {
        position: relative;
      }
      .accent-line-teal::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(180deg, #00F2EA 0%, transparent 100%);
      }
      
      .accent-line-fuchsia {
        position: relative;
      }
      .accent-line-fuchsia::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(180deg, #FF0050 0%, transparent 100%);
      }
      
      /* Selection */
      ::selection {
        background: rgba(0, 242, 234, 0.3);
        color: #F5F5F5;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.559.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://esm.run/@google/genai",
    "react-markdown": "https://esm.run/react-markdown"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-titan-bg text-text-primary antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
