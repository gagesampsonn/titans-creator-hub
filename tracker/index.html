<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Creator Campaign Tracker</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#1a1a1a',
            'dark-card': '#2a2a2a',
            'accent': '#ff6b00',
            'accent-hover': '#e55f00',
            'success': '#22c55e',
            'muted': '#555555',
          }
        }
      }
    }
  </script>

  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(255, 107, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
    }
    .pulse-today { animation: pulse-ring 2s infinite; }
    .day-cell { transition: all 0.15s ease; }
    .day-cell:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
